<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navigare Vim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- jetoanele „Senin" (copiate din src/styles.css) ---------- */
:root{
  --bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F6F7F9;--surface-3:#EEF0F3;
  --line:#E6E8EC;--txt:#1A1C20;--txt-dim:#565C66;--txt-faint:#868C96;
  --accent:#2F6BFF;--accent-soft:#EBF1FF;--done:#1F9D60;--blocked:#E5484D;--blocked-soft:#FDEEEE;
  --urgent:#D05A00;--urgent-soft:#FFF0E3;--star:#F5B000;--border-strong:#D5D9DF;
  --amb:0 1px 2px rgba(16,24,40,.05),0 6px 20px rgba(16,24,40,.07);
  --amb-lg:0 2px 6px rgba(16,24,40,.06),0 18px 44px rgba(16,24,40,.12);
  --layer-0:#2F6BFF;--layer-1:#1F7FD6;--layer-2:#0E8FB0;--layer-3:#0E9F8E;--layer-4:#1F9D60;
  --r:20px;--r-m:12px;--r-s:8px;
  --mono:'Geist Mono',ui-monospace,monospace;--display:'Inter',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141517;--surface:#1B1C1F;--surface-2:#232428;--surface-3:#2B2D32;--line:#2A2C31;
  --txt:#EEEFF1;--txt-dim:#A6ABB3;--txt-faint:#757A83;--accent:#5B8DFF;--accent-soft:rgba(91,141,255,.15);
  --done:#3DBF85;--blocked:#FF6369;--blocked-soft:rgba(255,99,105,.13);--urgent:#FF9548;--urgent-soft:rgba(255,149,72,.15);
  --star:#FFC53D;--border-strong:#3A3D44;
  --amb:inset 0 1px 0 rgba(255,255,255,.04),0 6px 22px rgba(0,0,0,.4);--amb-lg:inset 0 1px 0 rgba(255,255,255,.05),0 16px 44px rgba(0,0,0,.5);
  --layer-0:#5B8DFF;--layer-1:#4FA3F0;--layer-2:#3FB5D6;--layer-3:#2EC4B0;--layer-4:#4CC98A;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141517;--surface:#1B1C1F;--surface-2:#232428;--surface-3:#2B2D32;--line:#2A2C31;
  --txt:#EEEFF1;--txt-dim:#A6ABB3;--txt-faint:#757A83;--accent:#5B8DFF;--accent-soft:rgba(91,141,255,.15);
  --done:#3DBF85;--blocked:#FF6369;--blocked-soft:rgba(255,99,105,.13);--urgent:#FF9548;--urgent-soft:rgba(255,149,72,.15);
  --star:#FFC53D;--border-strong:#3A3D44;
  --amb:inset 0 1px 0 rgba(255,255,255,.04),0 6px 22px rgba(0,0,0,.4);--amb-lg:inset 0 1px 0 rgba(255,255,255,.05),0 16px 44px rgba(0,0,0,.5);
  --layer-0:#5B8DFF;--layer-1:#4FA3F0;--layer-2:#3FB5D6;--layer-3:#2EC4B0;--layer-4:#4CC98A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--display);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ---------- cadrul ---------- */
#app{display:flex;height:calc(100vh - 34px);overflow:clip}
.pane{position:relative;min-width:0}
.pane::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:transparent;z-index:3}
.pane.active::before{background:var(--accent)}

/* sidebar */
#sidebar{width:240px;flex:none;background:var(--surface-2);padding:14px 10px;overflow:auto}
#sidebar.hidden{display:none}
.sb-me{display:flex;align-items:center;gap:8px;padding:4px 8px 12px;font-weight:650}
.av{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.sb-sec{font-size:12px;font-weight:650;color:var(--txt-faint);padding:12px 8px 4px}
.sb-item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:var(--r-s);color:var(--txt-dim);cursor:pointer;position:relative}
.sb-item .n kbd{font-family:var(--display)}
.sb-item .n{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--txt-faint)}
.sb-item .n.red{color:var(--blocked)}
.sb-item.on{background:var(--surface-3);color:var(--txt);font-weight:600}
.sb-item.cur{box-shadow:inset 0 0 0 1.5px var(--accent)}
#sidebar:not(.active) .sb-item.cur{box-shadow:inset 0 0 0 1px var(--border-strong)}
.sb-item svg{width:16px;height:16px;flex:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin:0 3px}

/* lista */
#main{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
#main.full{border-right:0}
.m-head{padding:18px 28px 6px;display:flex;align-items:baseline;gap:12px}
.m-head h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.m-head .sub{color:var(--txt-faint);font-size:13px}
.tabs{display:flex;gap:4px;padding:2px 28px 6px}
.tab{padding:5px 10px;border-radius:var(--r-s);color:var(--txt-faint);font-weight:600;font-size:13px}
.tab.on{background:var(--surface-3);color:var(--txt)}
.waves{display:flex;gap:6px;padding:4px 28px 8px;flex-wrap:wrap}
.pill{padding:5px 11px;border-radius:var(--r-s);background:var(--surface-2);color:var(--txt-dim);font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.pill .c{font-family:var(--mono);font-size:11px;color:var(--txt-faint)}
.pill.on{background:var(--accent-soft);color:var(--accent)}
.pill.on .c{color:var(--accent)}
.pill kbd{margin-left:4px}
#filterbar{padding:0 28px 6px;display:none}
#filterbar.show{display:block}
#filterbar .f{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:var(--r-m);padding:6px 10px;box-shadow:inset 0 0 0 1px var(--line)}
#filterbar input{flex:1;border:0;background:transparent;font:inherit;color:var(--txt);outline:none}
#filterbar .f:focus-within{box-shadow:inset 0 0 0 1.5px var(--accent),0 0 0 3px var(--accent-soft)}
#filterbar .slash{font-family:var(--mono);color:var(--accent);font-weight:600}
#filterbar .cnt{font-size:12px;color:var(--txt-faint)}
#list{flex:1;overflow:auto;padding:4px 20px 80px}
.ghead{display:flex;align-items:center;gap:8px;padding:16px 8px 6px;font-size:12px;font-weight:650;color:var(--txt-dim)}
.ghead .n{font-family:var(--mono);color:var(--txt-faint);font-weight:500}
.ghead.red{color:var(--blocked)}
.ghead .lbar{width:3px;height:14px;border-radius:2px}
.ghead .lnum{font-family:var(--mono);font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:var(--r-m);position:relative;cursor:pointer}
.row::after{content:"";position:absolute;left:42px;right:10px;bottom:0;height:1px;background:var(--line)}
[data-f]{border-radius:var(--r-s);transition:box-shadow .08s}
.p-titlerow[data-f],.dep[data-f],.compose[data-f]{border-radius:var(--r-m);margin-left:-8px;margin-right:-8px;padding-left:8px;padding-right:8px}
#panel [data-f].fcur{box-shadow:0 0 0 1.5px var(--border-strong)}
#panel.active [data-f].fcur{box-shadow:0 0 0 2px var(--accent);background-color:var(--accent-soft)}
#panel.active .desc.fcur{background:var(--surface-2)}
.chip.off{background:transparent;color:var(--txt-faint);outline:1px dashed var(--border-strong);outline-offset:-1px}
.set-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-m)}
.set-row.cur{background:var(--accent-soft)}
.set-row .sd{font-size:12.5px;color:var(--txt-faint);margin-top:2px}
.set-row .sv{margin-left:auto;font-weight:650;font-size:13px;padding:4px 10px;border-radius:var(--r-s);background:var(--surface-3);white-space:nowrap}
.set-row .sv.on{background:var(--accent);color:#fff}
.row .ck{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.8px var(--pc);flex:none;display:grid;place-items:center}
.row .ck.urg{box-shadow:inset 0 0 0 1.8px var(--urgent);background:var(--urgent-soft)}
.row.done .ck{background:var(--pc);box-shadow:none}
.row.done .ck::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.row.done .t{color:var(--txt-faint);text-decoration:line-through}
.row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tail{display:flex;gap:10px;align-items:center;color:var(--txt-faint);font-size:12.5px;flex:none}
.row .tail .red{color:var(--blocked)}
.row .tail .proj{display:flex;gap:5px;align-items:center}
.row .tail .proj i{width:7px;height:7px;border-radius:50%}
.row .pin{width:14px;height:14px;color:var(--accent);flex:none}
.row.cur{background:var(--surface-2)}
#main.active .row.cur{background:var(--accent-soft)}
#main.active .row.cur::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--accent)}
.row.sel{background:var(--accent-soft)}
.row.sel .ck{outline:2px solid var(--accent);outline-offset:2px}
.row.docked .t{font-weight:600}
.row .dirty{font-size:11px;color:var(--urgent);font-weight:650}
mark{background:color-mix(in srgb,var(--star) 40%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.empty{color:var(--txt-faint);padding:30px 10px}

/* panoul */
#panel{width:min(520px,42vw);flex:none;display:flex;flex-direction:column;background:var(--bg);overflow:clip}
#panel.hidden{display:none}
.p-head{display:flex;align-items:center;gap:10px;padding:16px 22px 6px;color:var(--txt-faint);font-size:12.5px}
.p-head .id{font-family:var(--mono)}
.p-head .sp{flex:1}
.p-head .save{font-weight:650}
.p-head .save.dirty{color:var(--urgent)}
.p-head .save.clean{color:var(--txt-faint)}
.p-head .save.flash{animation:flash .5s 2}
@keyframes flash{50%{background:var(--urgent-soft)}}
.p-titlerow{display:flex;gap:12px;align-items:flex-start;padding:4px 22px 8px}
.p-titlerow .ck{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1.8px var(--pc);flex:none;margin-top:5px}
.p-titlerow .ck.urg{box-shadow:inset 0 0 0 1.8px var(--urgent);background:var(--urgent-soft)}
.p-titlerow .ck.on{background:var(--pc);box-shadow:none}
.p-title{flex:1;font:inherit;font-size:19px;font-weight:650;border:0;background:transparent;color:var(--txt);outline:none;padding:2px 6px;border-radius:var(--r-s);margin-left:-6px}
.p-title:focus{background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--accent)}
.p-chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 22px 12px}
.chip{display:flex;gap:6px;align-items:center;padding:5px 10px;border-radius:var(--r-s);background:var(--surface-2);font-size:12.5px;font-weight:600;color:var(--txt-dim)}
.chip.ghost{background:transparent;box-shadow:inset 0 0 0 1px dashed var(--line);color:var(--txt-faint);outline:1px dashed var(--border-strong);outline-offset:-1px}
.chip.urg{background:var(--urgent-soft);color:var(--urgent)}
.chip.pinned{background:var(--accent-soft);color:var(--accent)}
.chip.red{background:var(--blocked-soft);color:var(--blocked)}
.chip kbd{opacity:.8}
.p-body{flex:1;overflow:auto;padding:0 22px 40px}
.desc{width:100%;min-height:96px;resize:vertical;font:inherit;line-height:1.5;color:var(--txt);background:var(--surface-2);border:0;border-radius:var(--r-m);padding:10px 12px;outline:none;box-shadow:inset 0 0 0 1px var(--line)}
.desc:focus{background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--accent),0 0 0 3px var(--accent-soft)}
.sec{margin-top:18px}
.sec h4{margin:0 0 6px;font-size:12px;font-weight:650;color:var(--txt-faint)}
.dep{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:13px}
.dep .w{font-size:11px;color:var(--txt-faint);background:var(--surface-2);border-radius:6px;padding:1px 6px}
.dep .id{font-family:var(--mono);color:var(--txt-faint);font-size:12px}
.dep.done .tt{text-decoration:line-through;color:var(--txt-faint)}
.cm{display:flex;gap:10px;padding:8px 0}
.cm .b{flex:1}
.cm .who{font-size:12.5px;font-weight:650}
.cm .who span{font-weight:400;color:var(--txt-faint);margin-left:6px}
.cm .tx{margin-top:2px;line-height:1.45}
.cm .handoff{font-size:12px;color:var(--accent);font-weight:600}
.compose{display:flex;gap:10px;align-items:flex-start;margin-top:6px}
.compose textarea{flex:1;font:inherit;resize:none;min-height:40px;border:0;background:transparent;color:var(--txt);outline:none;padding:9px 10px;border-radius:var(--r-m)}
.compose textarea:focus{background:var(--surface-2);box-shadow:inset 0 0 0 1.5px var(--accent);min-height:80px}
.compose .to{font-size:12px;color:var(--accent);font-weight:600;margin:0 0 4px 44px}

/* bara de stare */
#status{position:fixed;left:0;right:0;bottom:0;height:34px;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--surface-2);font-size:12.5px;color:var(--txt-dim);border-top:1px solid var(--line)}
.mode{font-family:var(--mono);font-weight:600;font-size:12px;padding:3px 8px;border-radius:6px;background:var(--surface-3);color:var(--txt)}
.mode.ins{background:var(--done);color:#fff}
.mode.vis{background:var(--accent);color:#fff}
.mode.cmd{background:var(--star);color:#1A1C20}
#pending{font-family:var(--mono);font-weight:600;color:var(--accent);min-width:40px}
#lastkey{font-family:var(--mono);color:var(--txt-faint)}
#status .sp{flex:1}
#status label{display:flex;gap:6px;align-items:center;cursor:pointer}
#status .tb{background:transparent;border:0;cursor:pointer;color:var(--txt-dim);padding:3px 6px;border-radius:6px}
#status .tb:hover{background:var(--surface-3)}
#msg{color:var(--txt)}
kbd{font-family:var(--mono);font-size:11px;padding:1px 5px;border-radius:5px;background:var(--surface-3);color:var(--txt-dim);font-weight:500}

/* toast */
#toast{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);background:var(--txt);color:var(--bg);border-radius:var(--r-m);padding:10px 14px;display:none;gap:14px;align-items:center;box-shadow:var(--amb-lg);font-size:13.5px;overflow:hidden;z-index:30}
#toast.show{display:flex}
#toast b{color:var(--star);font-weight:700}
#toast .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--star)}

/* which-key */
#wk{position:fixed;right:14px;bottom:44px;background:var(--surface);box-shadow:var(--amb-lg);border-radius:var(--r);padding:12px 14px;display:none;min-width:230px;z-index:25}
#wk.show{display:block}
#wk h5{margin:0 0 8px;font-size:12px;color:var(--txt-faint);font-weight:650}
#wk .it{display:flex;gap:10px;padding:3px 0;font-size:13px}
#wk .it kbd{min-width:28px;text-align:center;color:var(--accent);background:var(--accent-soft)}

/* popover / overlay */
#ov{position:fixed;inset:0;display:none;z-index:40}
#ov.show{display:block}
#ov .bg{position:absolute;inset:0;background:rgba(20,22,28,.28)}
.box{position:absolute;background:var(--surface);border-radius:var(--r);box-shadow:var(--amb-lg);overflow:hidden}
.box.center{left:50%;top:14vh;transform:translateX(-50%);width:min(560px,92vw)}
.box.pop{width:260px;padding:6px}
.box .inp{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.box .inp input{flex:1;border:0;background:transparent;font:inherit;font-size:16px;color:var(--txt);outline:none}
.box .res{max-height:50vh;overflow:auto;padding:6px}
.opt{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--r-s);font-size:13.5px}
.opt.cur{background:var(--accent-soft);color:var(--accent)}
.opt .k{margin-left:auto}
.opt .id{font-family:var(--mono);color:var(--txt-faint);font-size:12px}
.box .foot{padding:8px 14px;font-size:12px;color:var(--txt-faint);border-top:1px solid var(--line);display:flex;gap:14px}
.help{width:min(880px,94vw);max-height:84vh;display:flex;flex-direction:column}
.help .scroll{overflow:auto;padding:6px 24px 24px}
.help h3{margin:18px 0 6px;font-size:13px;font-weight:700}
.help h3 .here{font-size:11px;color:var(--accent);background:var(--accent-soft);padding:2px 6px;border-radius:5px;margin-left:6px;font-weight:650}
.help table{width:100%;border-collapse:collapse}
.help td{padding:4px 6px;font-size:13px;vertical-align:top;border-bottom:1px solid var(--line)}
.help td:first-child{width:150px;white-space:nowrap}
.help .scen li{margin:6px 0;line-height:1.5}
.help .note{font-size:12.5px;color:var(--txt-dim);line-height:1.5;background:var(--surface-2);border-radius:var(--r-m);padding:10px 14px;margin-top:10px}
.help .top{display:flex;align-items:center;gap:12px;padding:16px 24px 6px}
.help .top h2{margin:0;font-size:18px}
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar" class="pane"></nav>
  <main id="main" class="pane">
    <div id="mhead"></div>
    <div id="filterbar"><div class="f"><span class="slash">/</span><input id="finput" placeholder="caută în lista asta — Enter sare la prima, n / N următoarea"><span class="cnt" id="fcnt"></span></div></div>
    <div id="list"></div>
  </main>
  <aside id="panel" class="pane hidden"></aside>
</div>
<div id="status">
  <span class="mode" id="mode">-- NORMAL --</span>
  <span id="where"></span>
  <span id="pending"></span>
  <span id="msg"></span>
  <span class="sp"></span>
  <span id="lastkey"></span>
  <label title="Pe tastatura RO standard [ ; ' \ dau ă ș ț â. Bifat: așa arată e.key, dar comanda se recunoaște după poziția tastei."><input type="checkbox" id="ro"> tastatură RO</label>
  <button class="tb" id="theme">temă</button>
  <span><kbd>?</kbd> ajutor</span>
</div>
<div id="toast"></div>
<div id="wk"></div>
<div id="ov"></div>

<script>
/* =====================================================================
   Prototip: navigare doar din tastatură (Vim). Date în memorie.
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
const ZILE = ['Duminică','Luni','Marți','Miercuri','Joi','Vineri','Sâmbătă'];
const LUNI = ['ian','feb','mar','apr','mai','iun','iul','aug','sep','oct','nov','dec'];
const dayDate = o => { const d = new Date(TODAY); d.setDate(d.getDate()+o); return d; };
const dayShort = o => { const d = dayDate(o); return `${d.getDate()} ${LUNI[d.getMonth()]}`; };
const dueLabel = o => o==null ? '' : o===0 ? 'Azi' : o===1 ? 'Mâine' : o===-1 ? 'ieri' : o<0 ? dayShort(o) : o<7 ? ZILE[dayDate(o).getDay()].slice(0,3)+' '+dayShort(o) : dayShort(o);
const nextMondayOff = () => { const d = TODAY.getDay(); return ((8-d)%7)||7; };

const ICON = {
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  at:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 006 0v-1a10 10 0 10-4 8"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  filter:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16l-6 8v6l-4-2v-4z"/></svg>',
  inbox:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 2h6l1-2h5"/></svg>',

/* ---------------- grupuri ---------------- */
function groups(){
  const g=groupsRaw();
  if (S.fmode==='filter' && S.q) return g.map(x=>({...x,rows:x.rows.filter(matches)})).filter(x=>x.rows.length);
  return g;
}
function groupsRaw(){
  const sc = S.screen, L = live();
  const byPin = (a,b)=> (b.pinned-a.pinned);
  const byTime = (a,b)=> (b.urgent-a.urgent) || ((a.time?0:1)-(b.time?0:1)) || a.time.localeCompare(b.time) || a.created-b.created;
  if (sc.kind==='today'){
    const inToday = L.filter(i=>i.due!=null && i.due<=0);
    const pin = inToday.filter(i=>i.pinned);
    return [
      {key:'pin', name:'Fixate', rows:pin},
      {key:'over', name:'Restanțe', red:true, rows:inToday.filter(i=>!i.pinned&&i.due<0).sort((a,b)=>(b.urgent-a.urgent)||a.due-b.due)},
      {key:'today', name:'Azi', rows:inToday.filter(i=>!i.pinned&&i.due===0).sort(byTime)},
    ].filter(g=>g.rows.length || g.key==='today');
  }
  if (sc.kind==='week'){
    const gs = [{key:'pin', name:'Fixate', rows:L.filter(i=>i.pinned&&i.due>=1&&i.due<=7)}];
    for (let o=1;o<=7;o++) gs.push({key:'d'+o, day:o, name: o===1?'Mâine':ZILE[dayDate(o).getDay()]+' '+dayShort(o),
      rows:L.filter(i=>!i.pinned&&i.due===o).sort(byTime)});
    return gs.filter(g=>g.rows.length);
  }
  if (sc.kind==='mine') return [{key:'mine', name:'Pasate ție', rows:L.filter(i=>i.assignee==='me')}];
  if (sc.kind==='filter'){
    const f = filters.find(f=>f.id===sc.fid);
    return projects.map(p=>({key:p.id, name:p.name, rows:L.filter(i=>i.project===p.id&&!i.done&&f.match(i)).sort(byPin)})).filter(g=>g.rows.length);
  }
  if (sc.kind==='project'){
    const p = P(sc.pid), rows = L.filter(i=>i.project===p.id);
    if (!p.waves) return [{key:'all', name:'Deschise', rows:rows.sort(byPin)}];
    const w = S.wave[p.id], inWave = rows.filter(i=>i.wave===w);
    if (w==='n') return [{key:'notes', name:'Notițe', rows:inWave}];
    const gs=[]; for (let l=0;l<5;l++){ const r=inWave.filter(i=>i.layer===l).sort(byPin); if(r.length) gs.push({key:'L'+l, layer:l, name:'Layer '+l, rows:r}); }
    return gs;
  }
  return [];
}

function rowTail(i){
  const sc=S.screen, bits=[];
  if (i.id===S.panelId && S.dirty) bits.push(`<span class="dirty">nesalvat</span>`);
  if (sc.kind==='project'){
    if (i.due!=null) bits.push(`<span class="${i.due<0?'red':''}">${dueLabel(i.due)}${i.time?' '+i.time:''}</span>`);
    bits.push(`<span class="mono">${i.id}</span>`);
  } else {
    if (i.due!=null && (i.due<0 || (sc.kind==='today'&&groupOf(i.id)?.key==='pin') || sc.kind!=='today' && sc.kind!=='week' || groupOf(i.id)?.key==='pin'))
      bits.push(`<span class="${i.due<0?'red':''}">${dueLabel(i.due)}${i.time?' '+i.time:''}</span>`);
    else if (i.time) bits.push(`<span class="mono">${i.time}</span>`);
    const p=P(i.project); bits.push(`<span class="proj"><i style="background:${p.color}"></i>${p.name}</span>`);
  }
  return bits.join('');
}

function chips(i){
  const p=P(i.project); const c=[];
  c.push(i.due!=null?`<span class="chip ${i.due<0?'red':''}">${dueLabel(i.due)}${i.time?' '+i.time:''} <kbd>t</kbd></span>`:`<span class="chip off">Dată <kbd>t</kbd></span>`);
  if (p.waves) c.push(`<span class="chip">${esc(p.waves.find(w=>w.id===i.wave)?.label||'—')} <kbd>w</kbd></span>`);
  c.push(`<span class="chip ${i.urgent?'urg':'off'}">⚡ Urgent <kbd>!</kbd></span>`);
  c.push(`<span class="chip ${i.pinned?'pinned':'off'}">${i.pinned?'Fixat sus':'Fixează'} <kbd>F</kbd></span>`);
  c.push(`<span class="chip ${i.assignee?'':'off'}">${i.assignee?(i.assignee==='me'?'Tu':i.assignee):'Pasează'} <kbd>@</kbd></span>`);
  c.push(`<span class="chip"><i class="dot" style="background:${p.color};margin:0"></i>${p.name} <kbd>M</kbd></span>`);
  return c.join('');
}

const pfList = () => [...document.querySelectorAll('#panel [data-f]')].map(e=>e.dataset.f);

function pfStep(d){
  const l=pfList(); if(!l.length) return;
  let ix=l.indexOf(S.pf); ix = ix<0?0:Math.max(0,Math.min(l.length-1,ix+d));
  pfSet(l[ix]);
}
function pfSet(f){
  S.pf=f; paintPF();
  const el=document.querySelector(`#panel [data-f="${CSS.escape(f)}"]`); el?.scrollIntoView({block:'nearest'});
  const name={title:'titlu',chips:'jetoane',desc:'descriere',comment:'comentariu'}[f]||('dependența '+f.slice(4));
  msg(name+' · Enter '+(f==='chips'?'deschide meniul (m)':f.startsWith('dep:')?'deschide':'scrie'));
}
function pfSection(d){
  const l=pfList(); const sec=f=>f.startsWith('dep:')?'deps':f;
  let ix=l.indexOf(S.pf); if(ix<0){ pfSet(l[0]); return; }
  const here=sec(l[ix]);
  if (d>0){ while(ix<l.length-1 && sec(l[ix])===here) ix++; }
  else { while(ix>0 && sec(l[ix])===here) ix--; const s2=sec(l[ix]); while(ix>0 && sec(l[ix-1])===s2) ix--; }
  pfSet(l[ix]);
}
function pfActivate(){
  const f=S.pf;
  if (f==='title') return focusPanel('title');
  if (f==='desc') return focusPanel('desc');
  if (f==='comment') return focusPanel('comment');
  if (f==='chips') return openOverlay('menu');
  if (f==='date') return openOverlay('date');
  if (f==='wave') return openOverlay('wave');
  if (f==='assign') return openOverlay('handoff');
  if (f==='project') return openOverlay('move');
  if (f==='urgent') return A.urgent();
  if (f==='pin') return A.pin();
  if (f.startsWith('dep:')) { const id=f.slice(4); openPanel(id); S.pane='panel'; paint(); }
}

function closeOverlay(){ S.overlay=null; $('#ov').classList.remove('show'); $('#ov').innerHTML=''; paint(); }
function overlayKey(e,t){
  const o=S.overlay, k=o.kind;
  if (t==='Escape'){ e.preventDefault(); if (o.parent){ openOverlay(o.parent); return true; } closeOverlay(); return true; }
  if (k==='settings'){
    const n=SETTINGS.length;
    if (t==='j'||t==='ArrowDown'){ o.ix=Math.min(n-1,o.ix+1); paintSettings(); return true; }
    if (t==='k'||t==='ArrowUp'){ o.ix=Math.max(0,o.ix-1); paintSettings(); return true; }
    if (['Enter','Space','l','h','ArrowRight','ArrowLeft'].includes(t)){ e.preventDefault(); SETTINGS[o.ix].toggle(); paintSettings(); paint(); return true; }
    return true;
  }
  if (k==='help'){ const sc=$('.help .scroll'); if(t==='j') sc.scrollBy(0,80); else if(t==='k') sc.scrollBy(0,-80); else if(t==='?'||t==='q') closeOverlay(); else if (t==='G') sc.scrollTo(0,1e6); return true; }
  if (k==='palette'||k==='search'){
    const it=resItems();
    const down = e.key==='ArrowDown' || (e.ctrlKey && (e.key==='j'||e.key==='n'));
    const up = e.key==='ArrowUp' || (e.ctrlKey && (e.key==='k'||e.key==='p'));
    if (down||up){ e.preventDefault(); o.ix=Math.max(0,Math.min(it.length-1,o.ix+(down?1:-1))); paintRes(); return true; }
    if (e.key==='Enter'){ e.preventDefault(); const x=it[o.ix]; closeOverlay(); if(!x) return true;
      if (k==='palette'){ if (x.wave) S.wave.hz=x.wave; go(x.s); }
      else { const f=flat(); if (f.includes(x.issue.id)) S.cursor=x.issue.id; openPanel(x.issue.id); }
      return true; }
    return false;   // tastele normale scriu în câmp
  }
  const opts=overlayOpts();
  if (e.key==='Backspace'){ e.preventDefault();
    if (o.num){ o.num=o.num.slice(0,-1); paintPop(); return true; }
    if (o.parent){ const par=o.parent; openOverlay(par); return true; }
    closeOverlay(); return true; }
  if (o.kind==='date' && /^[0-9]$/.test(t||'')){ o.num=(o.num||'')+t; if(o.num.length>4) o.num=o.num.slice(-4); paintPop(); return true; }
  if (o.kind==='date' && e.key==='Enter' && o.num){
    const tm=fmtTime(o.num); closeOverlay(); mutate('oră', i=>{ i.time=tm; if(i.due==null) i.due=0; }, ids=>plural(ids,'Ora '+tm), true); return true; }
  if (t==='j'||e.key==='ArrowDown'){ o.ix=Math.min(opts.length-1,o.ix+1); paintPop(); return true; }
  if (t==='k'||e.key==='ArrowUp'){ o.ix=Math.max(0,o.ix-1); paintPop(); return true; }
  const byKey=opts.find(x=>x.k===t || (x.k==='Del' && e.key==='Delete'));
  if (e.key==='Enter'||byKey){ e.preventDefault(); const x=byKey||opts[o.ix];
    if (x.dis){ msg(x.label+': '+x.dis); return true; }
    if (x.sub){ const par=o.kind; openOverlay(x.sub,{parent:par}); return true; }
    closeOverlay(); x.run(); return true; }
  return true;
}

/* ---------------- tasta → token (litere după e.key, punctuația după poziție) ---------------- */
const RO_SIM = {BracketLeft:['ă','Ă'], BracketRight:['î','Î'], Semicolon:['ș','Ș'], Quote:['ț','Ț'], Backslash:['â','Â']};
const BY_CODE = {Semicolon:[';',':'], BracketLeft:['[','{'], BracketRight:[']','}'], Slash:['/','?'], Period:['.','>'], Comma:[',','<'], Quote:["'",'"']};
function token(e){
  if (e.key==='Enter') return 'Enter';
  if (e.key===' ') return 'Space';
  if (e.key==='Escape') return 'Escape';
  if (e.key.startsWith('Arrow')) return e.key;
  if (/^[\x21-\x7e]$/.test(e.key)) return e.key;          // ASCII: ce scrie tasta
  if (BY_CODE[e.code]) return BY_CODE[e.code][e.shiftKey?1:0]; // ă ș ț â pe RO: după poziție
  return e.key.length===1?e.key:null;
}

/* ---------------- dispecerul ---------------- */
let seqT, wkT;
function clearBuf(){ S.buf=[]; S.count=''; clearTimeout(seqT); clearTimeout(wkT); $('#wk').classList.remove('show'); paint(); }
function ctxEntries(){
  const ctx=S.pane;
  let es=KEYMAP.filter(k=>(k.ctx===ctx||k.ctx==='any') && (S.vim ? !k.onlyClassic : (k.classic||k.onlyClassic)));
  // local bate global la aceeași secvență
  es=es.filter(k=>!(k.ctx==='any' && es.some(o=>o.ctx===ctx && o.seq===k.seq)));
  if (S.visual) es=es.filter(k=>VISUAL_OK.has(k.seq));
  return es;
}
function showWK(){
  const pre=S.buf.join(''); const es=ctxEntries().filter(k=>k.seq.startsWith(pre)&&k.seq!==pre&&!k.hide);
  if (!es.length) return;
  $('#wk').innerHTML=`<h5>${esc(pre)} …</h5>`+es.map(k=>`<div class="it"><kbd>${esc(k.seq.slice(pre.length))}</kbd>${esc(k.d)}</div>`).join('');
  $('#wk').classList.add('show');
}
function ladderEsc(){
  // fiecare Esc face un singur pas
  if (S.buf.length||S.count){ clearBuf(); msg('secvență anulată'); return; }
  const a=document.activeElement;
  if (a && a.id==='finput'){ a.blur(); if(!S.q) $('#filterbar').classList.remove('show'); S.pane='list'; paint(); return; }
  if (a && (a.tagName==='INPUT'&&a.type!=='checkbox' || a.tagName==='TEXTAREA')){
    if (S.isNew && a.id==='ptitle' && !a.value.trim()){ S.dirty=false; closePanel(true); msg('sarcina goală n-a fost creată'); return; }
    a.blur(); S.pane='panel'; paint(); msg('ieșit din câmp — încă un Esc: înapoi în listă'); return; }
  if (S.visual||S.selected.size){ S.visual=null; S.selected.clear(); renderList(); paint(); msg('ieșit din selecție'); return; }
  if (S.pane==='panel'){ S.pane='list'; renderList(); paint(); msg('în listă — încă un Esc închide panoul'); return; }
  if (S.pane==='sidebar'){ S.pane='list'; paint(); return; }
  if (S.panelId){ closePanel(); return; }
  if (S.q){ S.q=''; $('#finput').value=''; $('#filterbar').classList.remove('show'); renderList(); return; }
  if (S.cursor){ S.cursor=null; renderList(); paint(); }
}
window.addEventListener('keydown', e=>{
  if (e.isComposing) return;
  const t=token(e);
  // ce s-a apăsat, pentru verificare
  const shown = ($('#ro').checked && RO_SIM[e.code]) ? RO_SIM[e.code][e.shiftKey?1:0] : e.key;
  if (!['Shift','Control','Alt','Meta'].includes(e.key)) $('#lastkey').textContent = `tasta „${shown==' '?'␣':shown}” → ${t||'—'}`;

  if (S.overlay){ if (overlayKey(e,t)) return; return; }

  // combinații cu Ctrl
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); savePanel(); return; }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='f'){ e.preventDefault(); openOverlay('search'); return; }
  if ((e.ctrlKey||e.metaKey) && e.key==='Enter'){
    const a=document.activeElement;
    if (a?.id==='pcomp' && a.value.trim()){ e.preventDefault();
      const i=I(S.panelId); (THREAD[i.id] ||= []).push({who:'Tu',when:'acum',tx:a.value.trim(),handoff:S.handoffTo?('Pasat lui '+S.handoffTo):null});
      if (S.handoffTo){ snapshot([i.id],'pasare'); i.assignee=S.handoffTo; toast(`Pasat lui ${S.handoffTo} · <span class="mono">${i.id}</span>`,3000); } else toast('Comentariu trimis',2000);
      S.drafts[i.id]=''; S.handoffTo=null; renderPanel(true); render(); focusPanel('comment'); return; }
    if (a?.id==='pdesc'||a?.id==='ptitle'){ e.preventDefault(); savePanel(); a.blur(); S.pane='panel'; paint(); return; }
  }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='a' && S.pane==='list' && !['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){
    e.preventDefault(); S.visual=null; flat().forEach(id=>S.selected.add(id)); renderList(); paint(); msg('tot selectat · x dd D t ! F M · Esc iese'); return; }
  if (e.ctrlKey||e.metaKey||e.altKey) return;

  if (t==='Escape'){ e.preventDefault(); ladderEsc(); return; }

  // în câmp: tastele scriu
  const a=document.activeElement;
  if (a && a.id==='finput'){
    if (e.key==='Enter'){ e.preventDefault(); a.blur(); S.pane='list'; if (S.fmode==='filter'){ S.cursor=flat()[0]||null; renderList(); } else nextMatch(1); paint(); }
    return;
  }
  if (a && (a.tagName==='INPUT'&&a.type!=='checkbox' || a.tagName==='TEXTAREA' || a.tagName==='SELECT')){
    if (a.id==='ptitle' && e.key==='Enter'){ e.preventDefault(); if (S.dirty) savePanel(); a.blur(); S.pane='panel'; paint(); }
    return;
  }
  if (!t) return;

  // numărătoare (doar pe mișcări)
  if (/^[1-9]$/.test(t) || (t==='0' && S.count)){ if (!S.buf.length){ S.count+=t; paint(); clearTimeout(seqT); seqT=setTimeout(clearBuf,1500); e.preventDefault(); return; } }

  S.buf.push(t);
  const cur=S.buf.join('');
  const es=ctxEntries();
  const cand=es.filter(k=>{ const s=tokSplit(k.seq); return s.length>=S.buf.length && S.buf.every((x,ix)=>s[ix]===x); });
  const exact=cand.find(k=>tokSplit(k.seq).length===S.buf.length);
  const longer=cand.filter(k=>tokSplit(k.seq).length>S.buf.length);
  e.preventDefault();
  clearTimeout(seqT); clearTimeout(wkT);
  if (exact && !longer.length){
    $('#wk').classList.remove('show');
    const cnt=S.count; S.buf=[];
    exact.run(); S.count=''; void cnt; paint(); return;
  }
  if (!cand.length){ msg(`„${cur}” nu înseamnă nimic aici`); clearBuf(); return; }
  paint();
  wkT=setTimeout(showWK,400);
  seqT=setTimeout(()=>{ if (exact){ S.buf=[]; exact.run(); } clearBuf(); },1000);
});

/* ---------------- ajutorul (generat din KEYMAP) ---------------- */
function helpHTML(){
  const sec=(title,ctx)=>{ const rows=KEYMAP.filter(k=>k.ctx===ctx&&!k.hide);
    return `<h3>${title}${S.pane===ctx?'<span class="here">ești aici</span>':''}</h3><table>${rows.map(k=>`<tr><td>${tokSplit(k.seq).map(x=>`<kbd>${esc(x)}</kbd>`).join(' ')}</td><td>${esc(k.d)}</td></tr>`).join('')}</table>`; };
  const order=[['Listă','list'],['Panou (tichetul deschis)','panel'],['Bara laterală','sidebar']].sort((a,b)=>(b[1]===S.pane)-(a[1]===S.pane));
  return `<div class="top"><h2>Navigare din tastatură</h2><span style="color:var(--txt-faint);font-size:13px"><kbd>j</kbd><kbd>k</kbd> derulează · <kbd>Esc</kbd> închide</span></div><div class="scroll">
  <h3>Scenarii de încercat</h3><ol class="scen">
    <li><b>Meniul de acțiuni:</b> pe un rând <kbd>m</kbd> → <kbd>t</kbd> (dată) → <kbd>1</kbd><kbd>5</kbd><kbd>3</kbd><kbd>0</kbd> <kbd>Enter</kbd> pune ora 15:30. <kbd>m</kbd> <kbd>-</kbd> scoate data. <kbd>v</kbd> <kbd>j</kbd> <kbd>j</kbd> <kbd>m</kbd> <kbd>!</kbd> — urgent pe trei. Ce nu merge pe mai multe apare estompat. <kbd>Esc</kbd> / <kbd>⌫</kbd> urcă un nivel.</li>
    <li><b>Panoul pe secțiuni:</b> <kbd>Enter</kbd> <kbd>l</kbd>, apoi <kbd>J</kbd> <kbd>J</kbd> — ești pe descriere din două taste. <kbd>g</kbd><kbd>c</kbd> sare la comentariu.</li>
    <li><b>Prin tichet, câmp cu câmp:</b> <kbd>Enter</kbd> <kbd>l</kbd>, apoi <kbd>j</kbd> <kbd>j</kbd> <kbd>j</kbd> trec prin dată, val, urgent, fixare, pasare, proiect, descriere, dependențe, comentariu. <kbd>Enter</kbd> pe câmp: scrie / alege / comută / deschide dependența.</li>
    <li><b>Setări:</b> <kbd>g</kbd><kbd>,</kbd> (sau bara laterală → Setări). Oprește „Mod Vim” și încearcă săgețile + <kbd>Enter</kbd>; <kbd>j</kbd> nu mai face nimic.</li>
    <li><b>Triaj dimineața în Azi:</b> <kbd>j</kbd> <kbd>j</kbd> <kbd>x</kbd> · <kbd>d</kbd><kbd>d</kbd> · <kbd>u</kbd> · <kbd>D</kbd> · <kbd>.</kbd> (repetă „mâine” pe rândul următor)</li>
    <li><b>Interval:</b> <kbd>V</kbd> <kbd>j</kbd> <kbd>j</kbd> <kbd>D</kbd>, apoi <kbd>u</kbd> — toate se întorc deodată.</li>
    <li><b>Panoul urmează cursorul:</b> <kbd>Enter</kbd>, <kbd>j</kbd> <kbd>j</kbd> (panoul vine după). Apoi <kbd>l</kbd> <kbd>a</kbd>, scrie ceva, <kbd>Esc</kbd> <kbd>h</kbd> <kbd>j</kbd> — panoul rămâne, rândul spune „nesalvat”. <kbd>Ctrl+S</kbd> — panoul prinde cursorul.</li>
    <li><b>Scara Esc:</b> deschide un tichet, <kbd>a</kbd>, scrie, apoi <kbd>Esc</kbd> de patru ori și urmărește bara de jos.</li>
    <li><b>Proiecte și valuri:</b> <kbd>g</kbd><kbd>p</kbd> „hor” <kbd>Enter</kbd>, <kbd>[</kbd> <kbd>]</kbd>, <kbd>J</kbd> sare pe layer, <kbd>C</kbd> pune o sarcină în layerul cursorului.</li>
    <li><b>Căutare:</b> <kbd>f</kbd> „off” filtrează lista; <kbd>/</kbd> caută în toate proiectele.</li>
    <li><b>Pasare:</b> <kbd>g</kbd><kbd>m</kbd>, <kbd>Enter</kbd>, <kbd>l</kbd>, <kbd>@</kbd> <kbd>1</kbd>, scrie, <kbd>Ctrl+Enter</kbd>.</li>
    <li><b>Descoperire:</b> apasă <kbd>g</kbd> și așteaptă — apare lista continuărilor. Bifează „tastatură RO” jos și încearcă <kbd>:</kbd> și <kbd>[</kbd>.</li>
    <li><b>Bara laterală:</b> <kbd>h</kbd>, <kbd>j</kbd> <kbd>j</kbd>, <kbd>l</kbd> — ești în lista aleasă.</li>
    <li><b>Ca în yazi:</b> <kbd>g</kbd><kbd>w</kbd> (7 zile), <kbd>Space</kbd> <kbd>Space</kbd> <kbd>Space</kbd> <kbd>D</kbd> — trei rânduri pe mâine. Apoi <kbd>z</kbd> „hor” <kbd>Enter</kbd>, <kbd>]</kbd> <kbd>]</kbd>, <kbd>a</kbd> (sarcină nouă), <kbd>Esc</kbd>, <kbd>H</kbd> — înapoi în 7 zile, <kbd>L</kbd> — iar în proiect.</li>
    <li><b>Filtru vs. căutare:</b> <kbd>f</kbd> „off” ascunde restul; <kbd>/</kbd> „off” doar sare cu <kbd>n</kbd>. <kbd>r</kbd> redenumește, <kbd>Ctrl+A</kbd> selectează tot.</li>
  </ol>
  <h3>Oriunde</h3><table>${KEYMAP.filter(k=>k.ctx==='any'&&!k.hide).map(k=>`<tr><td>${tokSplit(k.seq).map(x=>`<kbd>${esc(x)}</kbd>`).join(' ')}</td><td>${esc(k.d)}</td></tr>`).join('')}
    <tr><td><kbd>Esc</kbd></td><td>Un pas înapoi: secvența → câmpul → selecția → panoul → lista → închide panoul</td></tr>
    <tr><td><kbd>Ctrl+S</kbd></td><td>Salvează tichetul</td></tr><tr><td><kbd>Ctrl+Enter</kbd></td><td>În comentariu: trimite (și pasează). În titlu / descriere: salvează și ieși.</td></tr></table>
  ${order.map(([t,c])=>sec(t,c)).join('')}
  <div class="note"><b>Din yazi:</b> <kbd>a</kbd> creează, <kbd>r</kbd> redenumește, <kbd>Space</kbd> bifează și coboară, <kbd>H</kbd>/<kbd>L</kbd> = istoric înapoi/înainte (panourile doar cu <kbd>h</kbd>/<kbd>l</kbd>), <kbd>[</kbd> <kbd>]</kbd> = valuri (după poziție: ă/î pe RO), <kbd>f</kbd> filtrează, <kbd>z</kbd> = „Mergi la”. Amânat: <kbd>X</kbd> taie + <kbd>p</kbd> lipește în ziua/valul cursorului. <kbd>x</kbd> rămâne „gata”, <kbd>.</kbd> rămâne „repetă”.<br><br><b>Ce s-a schimbat față de azi, de decis:</b> <kbd>,</kbd> <kbd>.</kbd> pentru valuri devin <kbd>[</kbd> <kbd>]</kbd> / <kbd>g</kbd><kbd>t</kbd> <kbd>g</kbd><kbd>T</kbd>, ca <kbd>.</kbd> să repete. <kbd>V</kbd> e selecția pe interval; foaia „Valuri” s-ar muta pe <kbd>g</kbd><kbd>v</kbd>. <kbd>o</kbd> deschide (cum ai cerut), deci căutarea rămâne pe <kbd>O</kbd> și <kbd>Ctrl+F</kbd>. Primul <kbd>Esc</kbd> într-un câmp din panou nu mai închide panoul. Numerele (<kbd>5</kbd><kbd>j</kbd>) merg doar pe mișcări, nu pe <kbd>3</kbd><kbd>d</kbd><kbd>d</kbd>; în proiect, <kbd>1</kbd>–<kbd>4</kbd> rămân taburile (aici nu sunt simulate).</div>
  </div>`;
}

/* ---------------- start ---------------- */
S.cursor=flat()[0];
render();
setTimeout(()=>toast('Prototip · apasă <b>?</b> pentru taste și scenarii',4000),300);
</script>
</body>
</html>
