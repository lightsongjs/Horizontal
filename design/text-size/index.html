<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mărimea textului în listă</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--bg2:#F6F7F9;--raise:#E8EBF0;--txt:#1A1C20;--dim:#565C66;--faint:#868C96;--sep:#EEF0F3;--acc-soft:#EBF1FF;--pc:#22B07D;--star:#F5B000}
*{box-sizing:border-box;margin:0}body{font-family:Inter,system-ui,sans-serif;background:#DDE1E7;padding:20px;color:var(--txt)}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.cap{font-size:13px;font-weight:650;color:var(--dim);margin-bottom:8px}.cap b{color:var(--txt)}
.app{display:flex;background:var(--bg);border-radius:16px;overflow:hidden;height:560px}
.side{width:200px;background:var(--bg2);padding:14px 10px;flex-shrink:0}
.nav{display:flex;align-items:center;gap:10px;min-height:32px;padding:5px 10px;font-size:14px;font-weight:550;color:var(--dim);border-radius:8px}
.nav.on{background:var(--raise);color:var(--txt)}.nav .n{margin-left:auto;font-size:12.5px;color:var(--faint)}
.main{flex:1;padding:20px 24px;min-width:0}
h1{font-weight:750;letter-spacing:-.025em;line-height:1.2}
.gh{display:flex;gap:8px;padding:10px 8px 6px;font-weight:650}
.gh .c{color:var(--faint);font-weight:550}
.row{display:flex;align-items:center;gap:12px;padding:0 10px;position:relative;border-radius:12px}
.row:after{content:"";position:absolute;left:40px;right:0;bottom:0;height:1px;background:var(--sep)}
.row.sel{background:var(--acc-soft)}.row.sel:after{display:none}
.ck{width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1.75px var(--pc);flex-shrink:0}
.t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-family:'Geist Mono',monospace;color:var(--dim)}.pj{color:var(--faint)}
/* ACUM */
.A h1{font-size:30px}.A .gh{font-size:14px}.A .row{min-height:44px}.A .t{font-size:15px;color:var(--txt)}.A .sel .t{font-weight:600}
.A .tm{font-size:12.5px;font-weight:600}.A .pj{font-size:12.5px}
/* PROPUS (desktop ≥900px) */
.B h1{font-size:26px}.B .gh{font-size:13px}.B .row{min-height:40px}
.B .t{font-size:14px;font-weight:400;color:color-mix(in srgb,var(--txt) 88%,var(--bg))}.B .sel .t{font-weight:550;color:var(--txt)}
.B .tm{font-size:12px;font-weight:500}.B .pj{font-size:12px}
</style></head><body>
<div class="wrap">
<div><p class="cap"><b>Acum</b> — titlu 15px/400 cerneală plină, rând 44px, h1 30px (= macheta A)</p><div class="app A" id="A"></div></div>
<div><p class="cap"><b>Propus, laptop</b> — titlu 14px/400 cerneală 88%, rând 40px, h1 26px, coada 12px/500</p><div class="app B" id="B"></div></div>
</div>
<script>
const side=`<div class="side">${[['Toate proiectele',''],['Azi','23',1],['Mâine','4'],['7 zile','35'],['Ale mele','2']].map(([l,n,on])=>`<div class="nav${on?' on':''}">${l}<span class="n">${n}</span></div>`).join('')}</div>`;
const rows=[['mapeaza netopia si smartbill','21:00'],['Cumpărături','',1],['cont de test pentru netopia'],['netopia raspuns? Script verificare'],['Evaluare buna clasa 4'],['Investlab site fain seo+ design'],['Scoate bani pentru biseica'],['Fix predici Padre saptybiericeasca'],['Fa plan poze cu redenumire corectă photos vee OneDrive'],['Transcriere Angela']];
const main=`<div class="main"><h1>Azi <span style="font-size:.58em;color:var(--faint);font-weight:600">23</span></h1><div class="gh">Azi <span class="c">23</span></div>${rows.map(([t,tm,s])=>`<div class="row${s?' sel':''}"><span class="ck"></span><span class="t">${t}</span>${tm?`<span class="tm">${tm}</span>`:''}<span class="pj">Inbox</span></div>`).join('')}</div>`;
for(const id of ['A','B'])document.getElementById(id).innerHTML=side+main;
</script></body></html>
