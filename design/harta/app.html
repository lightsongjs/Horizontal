<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hartă — machetă</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;550;650;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Jetoanele „Senin", copiate din src/styles.css (tema închisă în :root, cea deschisă dedesubt). */
:root {
  --bg:#141517; --surface:#1B1C1F; --surface-2:#232428; --surface-3:#2B2D32;
  --line:#2A2C31; --border-strong:#3A3D44;
  --txt:#EEEFF1; --txt-dim:#A6ABB3; --txt-faint:#757A83;
  --accent:#5B8DFF; --accent-soft:rgba(91,141,255,.15);
  --done:#3DBF85; --done-soft:rgba(61,191,133,.14);
  --amb: inset 0 1px 0 rgba(255,255,255,.04), 0 6px 22px rgba(0,0,0,.4);
  --pc:#5B8DFF;
  --r:20px; --r-m:12px; --r-s:8px;
  --display:'Inter',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace;
  --text-scale:1;
  /* Geometria hărții */
  --node-w:240px; --gap:72px;
  color-scheme: dark;
}
[data-theme='light'] {
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F6F7F9; --surface-3:#EEF0F3;
  --line:#E6E8EC; --border-strong:#D5D9DF;
  --txt:#1A1C20; --txt-dim:#565C66; --txt-faint:#868C96;
  --accent:#2F6BFF; --accent-soft:#EBF1FF;
  --done:#1F9D60; --done-soft:rgba(31,157,96,.10);
  --amb: 0 1px 2px rgba(16,24,40,.05), 0 6px 20px rgba(16,24,40,.07);
  --pc:#2F6BFF;
  color-scheme: light;
}
html[data-narrow] { --node-w:260px; --gap:56px; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--txt); font-family:var(--display);
  font-size:calc(14px * var(--text-scale)); -webkit-font-smoothing:antialiased; }
button { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

/* ── Antetul proiectului (ca în aplicație) ─────────────────────────── */
.head { padding:28px 32px 0; }
.head h1 { margin:0; font-size:calc(26px * var(--text-scale)); font-weight:700; letter-spacing:-.02em; }
.head p { margin:4px 0 0; color:var(--txt-dim); font-size:calc(13px * var(--text-scale)); }
.tabs { display:flex; gap:20px; margin-top:22px; }
.tabs span { padding:6px 0 9px; color:var(--txt-faint); font-weight:550; font-size:calc(15px * var(--text-scale)); }
.tabs span.on { color:var(--txt); box-shadow:inset 0 -2px 0 var(--accent); }
html[data-narrow] .head { padding:18px 16px 0; }
html[data-narrow] .head h1 { font-size:calc(22px * var(--text-scale)); }
html[data-narrow] .head p { display:none; }
html[data-narrow] .tabs { margin-top:14px; }

/* ── Bara hărții ──────────────────────────────────────────────────── */
.mapbar { display:flex; align-items:center; gap:12px; padding:18px 32px 6px; }
.mapbar .sum { color:var(--txt-dim); font-size:calc(13px * var(--text-scale)); flex:1; }
.chip { display:inline-flex; align-items:center; gap:7px; height:32px; padding:0 12px;
  border:0; border-radius:var(--r-s); background:var(--surface-2); color:var(--txt-dim);
  font-weight:550; font-size:calc(13px * var(--text-scale)); cursor:pointer; }
.chip .box { width:14px; height:14px; border-radius:4px; box-shadow:inset 0 0 0 1.5px var(--txt-faint); display:grid; place-items:center; }
.chip[aria-pressed='true'] { background:var(--done-soft); color:var(--done); }
.chip[aria-pressed='true'] .box { background:var(--done); box-shadow:none; }
.chip[aria-pressed='true'] .box::after { content:''; width:7px; height:4px; border:solid var(--bg); border-width:0 0 2px 2px; transform:translateY(-1px) rotate(-45deg); }
html[data-narrow] .mapbar { padding:14px 16px 4px; flex-wrap:wrap; }
html[data-narrow] .mapbar .sum { flex-basis:100%; order:2; }

/* ── Ramurile ─────────────────────────────────────────────────────── */
.branches { padding:0 0 8px; }
.sect { margin:28px 32px 0; color:var(--txt-faint); font-size:calc(12px * var(--text-scale)); font-weight:650; }
html[data-narrow] .sect { margin:24px 16px 0; }
.branch { margin-top:30px; }
.branch-h { display:flex; align-items:baseline; gap:8px; padding:0 32px 10px; font-size:calc(12px * var(--text-scale)); font-weight:650; color:var(--txt-dim); }
.branch-h .bid { font-family:var(--mono); font-weight:500; color:var(--txt-faint); white-space:nowrap; }
.branch-h .bt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.branch-h .bn { color:var(--txt-faint); font-weight:550; white-space:nowrap; }
html[data-narrow] .branch-h { padding:0 16px 8px; }
.band { overflow-x:auto; overflow-y:hidden; padding:4px 32px 14px; scrollbar-width:thin; }
/* Istoria derulată spre stânga se vede că există: marginea se stinge. */
.band.cut-l { -webkit-mask-image:linear-gradient(90deg, transparent 8px, #000 72px); mask-image:linear-gradient(90deg, transparent 8px, #000 72px); }
html[data-narrow] .band { padding:4px 16px 12px; scroll-snap-type:x mandatory; scroll-padding-left:16px; }
.canvas { position:relative; }
.canvas svg { position:absolute; inset:0; overflow:visible; pointer-events:none; }
.edge { fill:none; stroke:var(--border-strong); stroke-width:1.5; transition:stroke .15s, opacity .15s; }
.edge.hot { stroke:var(--accent); stroke-width:2; }

/* Nodul */
.node { position:absolute; width:var(--node-w); padding:10px 12px 11px 38px; border-radius:var(--r-m);
  background:var(--surface); box-shadow:var(--amb); cursor:pointer; scroll-snap-align:start;
  transition:opacity .15s, box-shadow .15s; }
.node .ck { position:absolute; left:12px; top:12px; width:16px; height:16px; border-radius:50%; box-shadow:inset 0 0 0 2px var(--pc); }
.node .id { font-family:var(--mono); font-size:calc(11px * var(--text-scale)); color:var(--txt-faint); line-height:1.3; }
.node .t { margin-top:2px; font-size:calc(13px * var(--text-scale)); font-weight:550; line-height:1.38;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.node.blocked { background:var(--surface-2); box-shadow:none; }
.node.blocked .ck { box-shadow:none; border:2px dotted var(--txt-faint); }
.node.blocked .t { color:var(--txt-dim); }
.node .wait { margin-top:3px; font-size:calc(12px * var(--text-scale)); color:var(--txt-faint); }
.node.done { background:transparent; box-shadow:inset 0 0 0 1px var(--line); }
.node.done .t { color:var(--txt-faint); font-weight:500; }
.node.done .ck { width:14px; height:14px; top:13px; left:13px; background:var(--done); box-shadow:none; }
.node.done .ck::after { content:''; position:absolute; left:4px; top:4px; width:5px; height:3px; border:solid var(--bg); border-width:0 0 1.5px 1.5px; transform:rotate(-45deg); }
.node.sel { box-shadow:var(--amb), 0 0 0 2px var(--accent); }
.node.done.sel { box-shadow:0 0 0 2px var(--accent); }

/* Rădăcina strânsă */
.root { position:absolute; height:28px; padding:0 10px; border:0; border-radius:var(--r-s);
  background:var(--done-soft); color:var(--done); display:inline-flex; align-items:center; gap:6px;
  font-size:calc(12px * var(--text-scale)); font-weight:650; cursor:pointer; white-space:nowrap; transition:opacity .15s; }
.root b { font-family:var(--mono); font-weight:500; font-size:calc(12.5px * var(--text-scale)); }
.root svg { position:static; }

.dim { opacity:.3; }

/* ── Fără legături ────────────────────────────────────────────────── */
.loose { margin:8px 32px 120px; max-width:880px; }
html[data-narrow] .loose { margin:8px 16px 120px; }
.grp { margin-top:14px; }
.grp-h { display:flex; align-items:center; gap:8px; width:100%; padding:10px 0; border:0; background:none;
  text-align:left; cursor:pointer; font-weight:650; font-size:calc(13px * var(--text-scale)); color:var(--txt-dim); }
.grp-h .dot { width:8px; height:8px; border-radius:50%; }
.grp-h .n { color:var(--txt-faint); font-weight:550; }
.grp-h .chev { margin-left:auto; color:var(--txt-faint); transition:transform .2s; }
.grp[data-open] .chev { transform:rotate(90deg); }
.grp-b { display:none; }
.grp[data-open] .grp-b { display:block; }
.row { position:relative; display:flex; align-items:baseline; gap:10px; padding:10px 0 10px 28px; font-size:calc(14px * var(--text-scale)); }
.row::after { content:''; position:absolute; left:28px; right:0; bottom:0; height:1px; background:var(--line); }
.row .ck { position:absolute; left:2px; top:12px; width:16px; height:16px; border-radius:50%; box-shadow:inset 0 0 0 2px var(--pc); }
.row .id { font-family:var(--mono); font-size:calc(11.5px * var(--text-scale)); color:var(--txt-faint); order:2; margin-left:auto; padding-left:12px; white-space:nowrap; }
.row .t { min-width:0; }
.row.done .t { color:var(--txt-faint); }
.row.done .ck { background:var(--done); box-shadow:none; }

/* ── Bara de selecție (telefon; pe desktop ține locul panoului lateral) ── */
.selbar { position:fixed; left:16px; right:16px; bottom:16px; height:56px; display:flex; align-items:center; gap:12px;
  padding:0 8px 0 16px; border-radius:var(--r-m); background:var(--surface-2); box-shadow:var(--amb);
  transform:translateY(90px); visibility:hidden; transition:transform .2s ease-out, visibility .2s; }
.selbar.on { transform:none; visibility:visible; }
.selbar .id { font-family:var(--mono); font-size:calc(11.5px * var(--text-scale)); color:var(--txt-faint); }
.selbar .t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:550; }
.selbar button { height:40px; padding:0 14px; border:0; border-radius:var(--r-s); background:var(--accent); color:#fff; font-weight:650; cursor:pointer; }
html:not([data-narrow]) .selbar { left:auto; width:460px; right:32px; }
.toast { position:fixed; left:50%; bottom:84px; transform:translateX(-50%); padding:8px 14px; border-radius:var(--r-s);
  background:var(--txt); color:var(--bg); font-size:calc(13px * var(--text-scale)); opacity:0; transition:opacity .2s; pointer-events:none; }
.toast.on { opacity:1; }

@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<header class="head">
  <h1>Dolmenwood</h1>
  <p>Jocul Dolmenwood online (rescriere): Cloudflare Workers + Durable Objects + D1 + R2, TypeScript, Svelte 5, PixiJS</p>
  <nav class="tabs" aria-label="Vederi"><span>List</span><span>Cards</span><span class="on">Hartă</span><span>Teme</span></nav>
</header>
<div class="mapbar">
  <div class="sum" id="sum"></div>
  <button class="chip" id="showAll" aria-pressed="false"><span class="box"></span>Arată și închise</button>
</div>
<main class="branches" id="branches"></main>
<section class="loose" id="loose"></section>
<div class="selbar" id="selbar" role="status"><span class="id"></span><span class="t"></span><button type="button" id="openBtn">Deschide</button></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
const qs = new URLSearchParams(location.search)
if (qs.get('theme') === 'light') document.documentElement.dataset.theme = 'light'
const narrow = qs.get('phone') === '1' || innerWidth < 900
if (narrow) document.documentElement.toggleAttribute('data-narrow', true)

const RM = matchMedia('(prefers-reduced-motion: reduce)').matches
const L = window.DW
// Exemplu inventat (cerut de Ionuț): un tichet de care depind două, iar din
// ele trei, respectiv patru. Ca să se vadă o ramură stufoasă; Dolmenwood n-are.
const EX = (n, t, deps, d = false) => ({ id: `EX-${String(n).padStart(2, '0')}`, t, d, deps: deps.map((k) => `EX-${String(k).padStart(2, '0')}`), th: null })
if (qs.get('exemplu') !== '0') L.push(
  EX(1, 'Motor: regulile de călătorie pe hexagoane', [], true),
  EX(2, 'Harta: hexagoanele din Dolmenwood', [], true),
  EX(3, 'Lumea: regiunile din Dolmenwood, cu granițele lor', [1, 2]),
  EX(4, 'Așezările: satele și târgurile de pe drumul mare', [3]),
  EX(5, 'Sălbăticia: pădurile, mlaștinile și potecile ascunse', [3]),
  EX(6, 'Lankshorn: hanul, piața și conacul', [4]),
  EX(7, 'Prigwort: berăria și breslele', [4]),
  EX(8, 'Castelul Brackenwold și curtea ducelui', [4]),
  EX(9, 'Întâlnirile din pădure, pe tipuri de teren', [5]),
  EX(10, 'Vremea pe anotimpuri și efectul ei', [5]),
  EX(11, 'Rătăcirea în ceață și cum te regăsești', [5]),
  EX(12, 'Ciupercile, culesul și otrăvurile', [5]),
)
const by = Object.fromEntries(L.map((x) => [x.id, x]))
const num = (id) => Number(id.split('-')[1])
const THEMES = { 'product-question': { name: 'Întrebări de produs', color: '#C27C0E' } }

// ── Ramurile = componentele conexe ────────────────────────────────────
const nb = {}
for (const x of L) { nb[x.id] ??= new Set(); for (const d of x.deps) { nb[x.id].add(d); (nb[d] ??= new Set()).add(x.id) } }
const comps = []
const seen = new Set()
for (const x of [...L].sort((a, b) => num(a.id) - num(b.id))) {
  if (seen.has(x.id) || !nb[x.id].size) continue
  const st = [x.id], c = []
  seen.add(x.id)
  while (st.length) { const v = st.pop(); c.push(v); for (const w of nb[v]) if (!seen.has(w)) { seen.add(w); st.push(w) } }
  c.sort((a, b) => num(a) - num(b))
  comps.push(c)
}
const loose = L.filter((x) => !nb[x.id].size)

let showAll = false
try { showAll = localStorage.getItem('harta:dw:all') === '1' } catch {}
let selected = null

// ── Așezarea unei ramuri (Sugiyama în mic) ──────────────────────────────
function graphOf(ids) {
  const open = ids.filter((i) => !by[i].d)
  if (showAll) {
    const items = ids.map((i) => ({ key: i, kind: 'node' }))
    const edges = []
    for (const i of ids) for (const d of by[i].deps) edges.push([d, i])
    return { items, edges, hidden: 0 }
  }
  // Doar deschisele; închisele de dinaintea lor se strâng în rădăcină.
  const items = open.map((i) => ({ key: i, kind: 'node' }))
  const edges = []
  const doneCount = ids.length - open.length
  let fed = false
  for (const i of open) for (const d of by[i].deps) {
    if (!by[d].d) edges.push([d, i])
    else if (!edges.some((e) => e[0] === '@root' && e[1] === i)) { edges.push(['@root', i]); fed = true }
  }
  if (fed) items.unshift({ key: '@root', kind: 'root', count: doneCount })
  return { items, edges, hidden: doneCount }
}

function layout(g, H) {
  const W = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--node-w'))
  const GAP = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--gap'))
  const ROOT_W = 0 // lățimea rădăcinii se măsoară după randare; coloana ei e îngustă
  const item = Object.fromEntries(g.items.map((it) => [it.key, it]))
  const ins = {}, outs = {}
  for (const k in item) { ins[k] = []; outs[k] = [] }
  for (const [a, b] of g.edges) { outs[a].push(b); ins[b].push(a) }
  // coloana = cel mai lung drum din stânga
  const col = {}
  const depth = (k) => col[k] ?? (col[k] = ins[k].length ? 1 + Math.max(...ins[k].map(depth)) : 0)
  for (const k in item) depth(k)
  // muchiile lungi trec prin puncte intermediare, ca să nu taie un card
  const chains = []
  let dn = 0
  for (const [a, b] of g.edges) {
    const pts = [a]
    for (let c = col[a] + 1; c < col[b]; c++) { const k = `~${dn++}`; item[k] = { key: k, kind: 'dummy' }; col[k] = c; pts.push(k) }
    pts.push(b)
    chains.push({ from: a, to: b, pts })
  }
  const adjL = {}, adjR = {}
  for (const k in item) { adjL[k] = []; adjR[k] = [] }
  for (const ch of chains) for (let i = 0; i + 1 < ch.pts.length; i++) { adjR[ch.pts[i]].push(ch.pts[i + 1]); adjL[ch.pts[i + 1]].push(ch.pts[i]) }
  const nCols = Math.max(...Object.values(col)) + 1
  const cols = Array.from({ length: nCols }, () => [])
  for (const k in item) cols[col[k]].push(k)
  for (const c of cols) c.sort((a, b) => (a[0] === '~') - (b[0] === '~') || num(a.replace('@root', 'X-0').replace(/^~/, 'X-')) - num(b.replace('@root', 'X-0').replace(/^~/, 'X-')))
  // ordinea: baricentru, câteva treceri în ambele sensuri
  const pos = {}
  const index = () => cols.forEach((c) => c.forEach((k, i) => (pos[k] = i)))
  index()
  for (let it = 0; it < 8; it++) {
    const range = it % 2 ? [...cols.keys()].reverse() : [...cols.keys()]
    for (const ci of range) {
      const adj = it % 2 ? adjR : adjL
      const bc = (k) => adj[k].length ? adj[k].reduce((s, n) => s + pos[n], 0) / adj[k].length : pos[k]
      cols[ci].sort((a, b) => bc(a) - bc(b))
      cols[ci].forEach((k, i) => (pos[k] = i))
    }
  }
  // înălțimi și poziții verticale
  const h = (k) => item[k].kind === 'node' ? H : item[k].kind === 'root' ? 28 : 2
  const VG = 14
  const y = {}
  cols.forEach((c) => { let t = 0; for (const k of c) { y[k] = t; t += h(k) + VG } })
  const cy = (k) => y[k] + h(k) / 2
  for (let it = 0; it < 6; it++) {
    const range = it % 2 ? [...cols.keys()].reverse() : [...cols.keys()]
    for (const ci of range) {
      const adj = it % 2 ? adjR : adjL
      let bottom = -Infinity, prev = null
      for (const k of cols[ci]) {
        const want = adj[k].length ? adj[k].reduce((s, n) => s + cy(n), 0) / adj[k].length - h(k) / 2 : y[k]
        // copiii altui părinte încep după un spațiu dublu: grupurile se citesc separat
        const sib = prev && adjL[k].join() === adjL[prev].join()
        y[k] = Math.max(want, bottom + (bottom === -Infinity ? 0 : sib ? VG : VG * 2.5))
        bottom = y[k] + h(k)
        prev = k
      }
    }
  }
  const minY = Math.min(...Object.keys(item).map((k) => y[k]))
  for (const k in y) y[k] -= minY
  // x: coloana rădăcinii e îngustă
  const colW = cols.map((c) => c.some((k) => item[k].kind === 'node') ? W : c.some((k) => item[k].kind === 'root') ? 64 : 24)
  const colX = []
  colW.reduce((x, w, i) => { colX[i] = x; return x + w + GAP }, 0)
  const x = {}
  for (const k in item) x[k] = colX[col[k]]
  const width = colX[nCols - 1] + colW[nCols - 1]
  const height = Math.max(...Object.keys(item).map((k) => y[k] + h(k)))
  return { item, x, y, h, col, colX, colW, chains, width, height, GAP }
}

// muchie în unghi drept, colțuri de 8px; magistrala stă la jumătatea culoarului din fața țintei
function ortho(x0, y0, xb, y1, x1) {
  if (Math.abs(y1 - y0) < 1) return `M${x0} ${y0} H${x1}`
  const s = y1 > y0 ? 1 : -1
  const r = Math.min(8, Math.abs(y1 - y0) / 2, xb - x0, x1 - xb)
  return `M${x0} ${y0} H${xb - r} Q${xb} ${y0} ${xb} ${y0 + s * r} V${y1 - s * r} Q${xb} ${y1} ${xb + r} ${y1} H${x1}`
}

function edgePath(Lo, ch, rootW) {
  const { item, x, y, h, col, colX, colW, GAP } = Lo
  const right = (k) => item[k].kind === 'root' ? x[k] + rootW : item[k].kind === 'dummy' ? colX[col[k]] + colW[col[k]] : x[k] + parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--node-w'))
  let d = ''
  for (let i = 0; i + 1 < ch.pts.length; i++) {
    const a = ch.pts[i], b = ch.pts[i + 1]
    const x0 = right(a), y0 = y[a] + h(a) / 2
    const x1 = item[b].kind === 'dummy' ? colX[col[b]] : x[b]
    const y1 = y[b] + h(b) / 2
    const xb = x1 - GAP / 2
    d += ortho(x0, y0, xb, y1, x1) + (item[b].kind === 'dummy' ? ` M${x1} ${y1} H${colX[col[b]] + colW[col[b]]}` : '') + ' '
  }
  return d
}

// ── Randarea ──────────────────────────────────────────────────────────
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
let H = 64
const layouts = new Map()

function nodeHTML(id) {
  const x = by[id]
  const waits = x.d ? [] : x.deps.filter((d) => !by[d].d)
  const cls = x.d ? 'done' : waits.length ? 'blocked' : 'ready'
  return `<div class="node ${cls}" data-id="${id}" tabindex="0" role="button" aria-label="${id} ${esc(x.t)}">
    <span class="ck"></span><div class="id">${id}</div><div class="t">${esc(x.t)}</div></div>`
}

function render() {
  const main = document.getElementById('branches')
  const active = comps.filter((c) => c.some((i) => !by[i].d))
    .sort((a, b) => b.filter((i) => !by[i].d).length - a.filter((i) => !by[i].d).length || a.length - b.length)
  const finished = comps.filter((c) => c.every((i) => by[i].d))
  const shown = showAll ? [...active, ...finished] : active
  const openLoose = loose.filter((x) => !x.d).length
  document.getElementById('sum').textContent =
    `${active.length} ramuri în lucru · ${openLoose} fără legături` + (showAll ? ` · ${finished.length} ramuri terminate` : '')

  let html = ''
  shown.forEach((c, i) => {
    if (showAll && i === active.length) html += `<div class="sect">Ramuri terminate · ${finished.length}</div>`
    const root = by[c[0]]
    const open = c.filter((id) => !by[id].d).length
    html += `<section class="branch" data-b="${i}">
      <div class="branch-h"><span class="bid">${root.id}</span><span class="bt">${esc(root.t)}</span>
      <span class="bn">· ${open ? `${open} ${open === 1 ? 'deschis' : 'deschise'} din ${c.length}` : `toate ${c.length} închise`}${root.id.startsWith('EX-') ? ' · exemplu inventat' : ''}</span></div>
      <div class="band"><div class="canvas"></div></div></section>`
  })
  main.innerHTML = html

  // înălțimea nodului: măsurată, ca să țină cont de --text-scale și de fonturi
  const probe = document.createElement('div')
  probe.style.cssText = 'position:absolute;visibility:hidden'
  probe.innerHTML = nodeHTML('DW-15')
  document.body.append(probe)
  H = Math.ceil(probe.firstElementChild.getBoundingClientRect().height)
  probe.remove()

  layouts.clear()
  shown.forEach((c, i) => {
    const g = graphOf(c)
    const Lo = layout(g, H)
    layouts.set(i, { g, Lo })
    const cv = main.querySelector(`[data-b="${i}"] .canvas`)
    cv.style.width = Lo.width + 'px'
    cv.style.height = Lo.height + 'px'
    let inner = ''
    for (const k in Lo.item) {
      const it = Lo.item[k]
      if (it.kind === 'node') inner += nodeHTML(k).replace('class="node', `style="left:${Lo.x[k]}px;top:${Lo.y[k]}px" class="node`)
      if (it.kind === 'root') inner += `<button class="root" data-id="@root" style="left:${Lo.x[k]}px;top:${Lo.y[k]}px" title="Arată cele ${it.count} închise de dinainte">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><b>${it.count}</b></button>`
    }
    cv.innerHTML = `<svg width="${Lo.width}" height="${Lo.height}"></svg>` + inner
    // rădăcina: aliniată la dreapta coloanei ei, apoi muchiile pornesc din marginea ei reală
    const rootEl = cv.querySelector('.root')
    let rootW = 0
    if (rootEl) rootW = rootEl.offsetWidth
    cv.querySelector('svg').innerHTML = Lo.chains.map((ch) =>
      `<path class="edge" data-from="${ch.from}" data-to="${ch.to}" d="${edgePath(Lo, ch, rootW)}"/>`).join('')
  })

  renderLoose()
  applySel()
  document.querySelectorAll('.band').forEach((b) => {
    const mark = () => b.classList.toggle('cut-l', b.scrollLeft > 4)
    b.addEventListener('scroll', mark, { passive: true })
    mark()
  })
}

function renderLoose() {
  const groups = {}
  for (const x of loose) { if (!showAll && x.d) continue; (groups[x.th ?? ''] ??= []).push(x) }
  const order = Object.keys(groups).sort((a, b) => (a === '') - (b === ''))
  const el = document.getElementById('loose')
  const wasOpen = new Set([...el.querySelectorAll('.grp[data-open]')].map((g) => g.dataset.k))
  const n = Object.values(groups).reduce((s, g) => s + g.length, 0)
  el.innerHTML = `<div class="sect" style="margin-left:0;margin-right:0">Fără legături · ${n}</div>` + order.map((k) => {
    const items = groups[k].sort((a, b) => a.d - b.d || num(a.id) - num(b.id))
    const th = THEMES[k]
    const name = th ? th.name : 'Fără temă'
    const isOpen = wasOpen.size ? wasOpen.has(k) : k === ''
    return `<div class="grp" data-k="${k}" ${isOpen ? 'data-open' : ''}>
      <button class="grp-h" type="button" aria-expanded="${isOpen}"><span class="dot" style="background:${th ? th.color : 'var(--txt-faint)'}"></span>${name}
      <span class="n">${items.length}</span>
      <svg class="chev" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M5 3l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
      <div class="grp-b">${items.map((x) => `<div class="row ${x.d ? 'done' : ''}"><span class="ck"></span><span class="t">${esc(x.t)}</span><span class="id">${x.id}</span></div>`).join('')}</div></div>`
  }).join('')
}

// ── Selecția: lanțul întreg se aprinde, restul coboară ────────────────
function lineage(b, id) {
  const { g } = layouts.get(b)
  const up = new Set(), down = new Set()
  const ins = (k) => g.edges.filter((e) => e[1] === k).map((e) => e[0])
  const outs = (k) => g.edges.filter((e) => e[0] === k).map((e) => e[1])
  const walk = (k, next, set) => { for (const n of next(k)) if (!set.has(n)) { set.add(n); walk(n, next, set) } }
  walk(id, ins, up); walk(id, outs, down)
  return { up, down }
}
function applySel() {
  document.querySelectorAll('.dim, .hot, .sel').forEach((e) => e.classList.remove('dim', 'hot', 'sel'))
  const bar = document.getElementById('selbar')
  if (!selected) { bar.classList.remove('on'); return }
  const { b, id } = selected
  const { up, down } = lineage(b, id)
  const keep = new Set([id, ...up, ...down])
  document.querySelectorAll('.branch').forEach((br) => {
    const same = Number(br.dataset.b) === b
    br.querySelectorAll('.node, .root').forEach((n) => n.classList.toggle('dim', !same || !keep.has(n.dataset.id)))
    br.querySelectorAll('.edge').forEach((e) => {
      const f = e.dataset.from, t = e.dataset.to
      const hot = same && ((up.has(f) && (t === id || up.has(t))) || ((f === id || down.has(f)) && down.has(t)))
      e.classList.toggle('hot', hot)
      e.classList.toggle('dim', !hot)
    })
  })
  document.getElementById('loose').classList.add('dim')
  const el = document.querySelector(`[data-b="${b}"] [data-id="${id}"]`)
  el?.classList.add('sel')
  if (id !== '@root') {
    const waits = by[id].d ? [] : by[id].deps.filter((d) => !by[d].d)
    bar.querySelector('.id').textContent = waits.length ? `${id} · așteaptă ${waits.join(', ')}` : id
    bar.querySelector('.t').textContent = by[id].t
    bar.classList.add('on')
  } else bar.classList.remove('on')
}
function clearSel() { selected = null; document.getElementById('loose').classList.remove('dim'); applySel() }

function toast(msg) {
  const t = document.getElementById('toast')
  t.textContent = msg; t.classList.add('on')
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1800)
}

// ── „Arată și închise": deschisele rămân pe loc, istoria apare în stânga ──
function setShowAll(v) {
  // ancora: primul nod deschis din fiecare ramură, unde e acum pe ecran
  const before = new Map()
  document.querySelectorAll('.node, .root').forEach((n) => before.set(n.closest('.branch').dataset.b + '|' + n.dataset.id, n.getBoundingClientRect()))
  const anchors = [...document.querySelectorAll('.branch')].map((br) => {
    const n = [...br.querySelectorAll('.node')].find((e) => !e.classList.contains('done'))
    return n && { b: br.dataset.b, id: n.dataset.id, left: n.getBoundingClientRect().left }
  })
  const rootRects = new Map([...document.querySelectorAll('.root')].map((r) => [r.closest('.branch').dataset.b, r.getBoundingClientRect()]))
  showAll = v
  try { localStorage.setItem('harta:dw:all', v ? '1' : '0') } catch {}
  document.getElementById('showAll').setAttribute('aria-pressed', String(v))
  selected = null
  document.getElementById('loose').classList.remove('dim')
  render()
  for (const a of anchors) {
    if (!a) continue
    const n = document.querySelector(`[data-b="${a.b}"] [data-id="${a.id}"]`)
    if (n) n.closest('.band').scrollLeft += n.getBoundingClientRect().left - a.left
  }
  document.querySelectorAll('.band').forEach((b) => b.classList.toggle('cut-l', b.scrollLeft > 4))
  if (RM) return
  document.querySelectorAll('.node, .root').forEach((n) => {
    const b = n.closest('.branch').dataset.b
    const old = before.get(b + '|' + n.dataset.id)
    const now = n.getBoundingClientRect()
    const from = old ?? rootRects.get(b)
    if (!from) return
    const dx = from.left - now.left, dy = from.top - now.top
    n.animate(old
      ? [{ transform: `translate(${dx}px,${dy}px)` }, { transform: 'none' }]
      : [{ transform: `translate(${dx}px,${dy}px) scale(.6)`, opacity: 0 }, { transform: 'none', opacity: 1 }],
      { duration: 240, easing: 'ease-out' })
  })
  document.querySelectorAll('.canvas svg').forEach((s) => s.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 240, easing: 'ease-out' }))
}

document.getElementById('showAll').addEventListener('click', (e) => setShowAll(e.currentTarget.getAttribute('aria-pressed') !== 'true'))
document.getElementById('showAll').setAttribute('aria-pressed', String(showAll))

document.addEventListener('click', (e) => {
  const grp = e.target.closest('.grp-h')
  if (grp) {
    const g = grp.parentElement
    g.toggleAttribute('data-open')
    grp.setAttribute('aria-expanded', String(g.hasAttribute('data-open')))
    return
  }
  if (e.target.closest('#openBtn')) { toast(narrow ? 'Aici se deschide foaia de tichet' : 'Aici se deschide tichetul în panoul lateral'); return }
  if (e.target.closest('.root')) { setShowAll(true); return }
  const n = e.target.closest('.node')
  if (!n) { if (!e.target.closest('.selbar')) clearSel(); return }
  const b = Number(n.closest('.branch').dataset.b)
  if (selected && !selected.hover && selected.b === b && selected.id === n.dataset.id) {
    toast(narrow ? 'Aici se deschide foaia de tichet' : 'Aici se deschide tichetul în panoul lateral')
    return
  }
  selected = { b, id: n.dataset.id }
  applySel()
  if (narrow) {
    const band = n.closest('.band')
    band.scrollTo({ left: n.offsetLeft - (band.clientWidth - n.offsetWidth) / 2, behavior: RM ? 'auto' : 'smooth' })
  }
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') clearSel()
  if (e.key === 'Enter' && e.target.classList?.contains('node')) e.target.click()
})
// pe desktop, hover-ul aprinde lanțul cât timp nu e nimic selectat
if (!narrow) {
  let hovered = null
  document.addEventListener('mouseover', (e) => {
    const n = e.target.closest('.node')
    if (n === hovered) return
    hovered = n
    if (selected && !selected.hover) return
    selected = n ? { b: Number(n.closest('.branch').dataset.b), id: n.dataset.id, hover: true } : null
    if (!selected) { document.getElementById('loose').classList.remove('dim') }
    applySel()
    if (selected) document.getElementById('selbar').classList.remove('on')
  })
}

document.fonts.ready.then(render)
render()
</script>
</body>
