apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def hzKeystore = file("${System.getProperty('user.home')}/.local/share/horizontal/android-release.jks")
def hzPass = file("${System.getProperty('user.home')}/.local/share/horizontal/android-release.pass")

android {
    namespace = "ro.horizontal.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ro.horizontal.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode trebuie să crească la fiecare APK nou instalat; versionName ajunge în getInfo().version.
        versionCode 6
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // AGP 8 nu mai generează BuildConfig implicit; pluginul îi citește VERSION_NAME.
    buildFeatures { buildConfig = true }
    kotlinOptions { jvmTarget = '21' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
    // Testele core citesc fixtures din rădăcina repo-ului, nu din modul.
    testOptions { unitTests.all { systemProperty 'hz.repoRoot', rootProject.projectDir.toPath().resolve('../..').normalize().toString() } }
    signingConfigs {
        release {
            // Cheia stă în afara repo-ului (spec, „Distribuția"); fără ea build-ul release pică explicit.
            if (hzKeystore.exists()) {
                storeFile hzKeystore
                storePassword hzPass.text.trim()
                keyAlias 'horizontal'
                keyPassword hzPass.text.trim()
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    implementation 'androidx.work:work-runtime-ktx:2.10.5'
    // Motorul JS al ferestrei de quick add (codul de captură al paginii, fără WebView). Cere minSdk 26.
    implementation 'androidx.javascriptengine:javascriptengine:1.0.0'
    // org.json din Android e un ciot pe JVM ("Method ... not mocked"); testele core îl iau real.
    testImplementation 'org.json:json:20250517'
    // OkHttp, nu HttpURLConnection: acela refuză verbul PATCH (coada nativă, Task 9).
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
