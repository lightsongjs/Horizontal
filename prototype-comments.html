<!doctype html>
<html lang="ro" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Horizontal — comentarii, creator, pasare (prototip interactiv)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ════════════════════════════════════════════════════════════════════════════
   PROTOTIP INTERACTIV — stare în memorie, ca prototype.html. Nimic de aici nu
   se copiază în aplicație ca și cod; jetoanele vizuale sunt însă copiate 1:1
   din src/styles.css, ca feedback-ul pe culoare/tipografie să fie valid.
   ════════════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#0B0B0E; --surface:#16161A; --surface-2:#1E1E23; --surface-3:#26262C;
  --line:#2A2A2E; --line-soft:#1B1B1F;
  --txt:#FAFAF9; --txt-dim:#9C9CA2; --txt-faint:#6B6B70;
  --accent:#818CF8; --accent-2:#6366F1; --accent-soft:rgba(129,140,248,0.13);
  --done:#63B79F; --done-soft:rgba(99,183,159,0.13);
  --blocked:#DF8B84; --blocked-soft:rgba(223,139,132,0.13);
  --active:#D9A661; --active-soft:rgba(217,166,97,0.13);
  --r:16px; --r-m:10px; --r-s:6px;
  --amb: inset 0 1px 0 rgba(255,255,255,0.055), 0 6px 24px rgba(0,0,0,0.42);
  --amb-lg: inset 0 1px 0 rgba(255,255,255,0.07), 0 18px 48px rgba(0,0,0,0.55);
  --layer-0:#8B93F7; --layer-1:#7FA0DE; --layer-2:#77ADC4; --layer-3:#74B4AC; --layer-4:#7BB79A;
  --on-accent:var(--bg);
  --field-bg:var(--surface-3);
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --display:'Literata','Iowan Old Style',Georgia,serif;
  color-scheme:dark;
}
[data-theme='light']{
  --bg:#F7F9FC; --field-bg:#F0F4F8; --surface:#FFFFFF; --surface-2:#F0F4F8; --surface-3:#E8EFF4;
  --line:rgba(168,179,187,0.38); --line-soft:rgba(168,179,187,0.18);
  --txt:#29343A; --txt-dim:#566168; --txt-faint:#717C84;
  --accent:#1A237E; --accent-2:#151B60; --accent-soft:rgba(26,35,126,0.08);
  --done:#2F6B4F; --done-soft:rgba(47,107,79,0.10);
  --blocked:#A0333F; --blocked-soft:rgba(160,51,63,0.09);
  --active:#8A5A18; --active-soft:rgba(138,90,24,0.10);
  --amb:0 6px 24px rgba(41,52,58,0.06); --amb-lg:0 18px 48px rgba(41,52,58,0.10);
  --layer-0:#3A43A8; --layer-1:#2F5C93; --layer-2:#2A6E7E; --layer-3:#2A756A; --layer-4:#33795C;
  color-scheme:light;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:var(--display); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; align-items:center;
}
button{font-family:inherit;color:inherit}
.mono{font-family:var(--mono)}

/* ══ PANOUL DE REGIE (nu face parte din aplicație) ═════════════════════════ */
.rig{
  width:100%; background:var(--surface-2); box-shadow:var(--amb);
  padding:10px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  position:sticky; top:0; z-index:40;
}
.rig .lbl{
  font-family:var(--mono); font-size:10px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--txt-faint);
}
.rig .grp{display:flex;align-items:center;gap:6px}
.rig .seg{display:flex;gap:2px;background:var(--bg);border-radius:var(--r-s);padding:3px}
.rig .seg button{
  background:none;border:0;border-radius:var(--r-s);cursor:pointer;color:var(--txt-faint);
  font-size:13px;padding:5px 11px;display:flex;align-items:center;gap:6px;
}
.rig .seg button.on{color:var(--txt);background:var(--surface-3)}
.rig .spacer{flex:1}
.rig .hint{color:var(--txt-faint);font-size:12.5px;max-width:46ch}
.rig .reset{
  background:none;border:0;cursor:pointer;color:var(--txt-faint);font-family:var(--mono);
  font-size:10px;letter-spacing:.09em;text-transform:uppercase;padding:6px 9px;border-radius:var(--r-s);
}
.rig .reset:hover{background:var(--surface-3);color:var(--txt)}

/* ══ RAMA DE TELEFON ═══════════════════════════════════════════════════════ */
#app{
  width:100%; max-width:430px; flex:1; min-height:0;
  display:flex; flex-direction:column; background:var(--bg);
  position:relative; overflow:hidden;
}
@media(min-width:480px){
  #app{margin:22px 0;height:calc(100dvh - 120px);flex:0 0 auto;border-radius:var(--r);box-shadow:var(--amb-lg)}
}
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}

/* ── antet ────────────────────────────────────────────────────────────────── */
.hdr{
  display:flex;align-items:center;gap:11px;padding:13px 15px 12px;
  background:var(--surface);box-shadow:var(--amb);position:relative;z-index:5;flex:0 0 auto;
}
.hdr .crumb{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-faint)}
.hdr h2{font-size:16.5px;font-weight:600;letter-spacing:-.012em;line-height:1.25}
.hdr .mid{flex:1;min-width:0}
.hdr .mid h2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ghost{
  background:none;border:0;color:var(--txt-dim);padding:6px;border-radius:var(--r-s);
  cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ghost:hover{background:var(--surface-3);color:var(--txt)}
.ghost:active{background:var(--surface-3)}

/* ── avatare ──────────────────────────────────────────────────────────────── */
.av{
  width:22px;height:22px;border-radius:50%;background:var(--surface-3);
  display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;font-weight:600;
  color:var(--txt-dim);flex:0 0 auto;
}
.av.me{background:var(--accent-soft);color:var(--accent)}
.av.lg{width:28px;height:28px;font-size:11px}
.av.ghosted{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--txt-faint)}

/* ══ LISTE ═════════════════════════════════════════════════════════════════ */
.pad{padding:13px 15px 22px}
.empty{
  text-align:center;color:var(--txt-faint);padding:52px 30px;font-size:14px;line-height:1.65;
}
.empty .big{display:block;color:var(--txt-dim);font-size:15.5px;margin-bottom:6px}
.grp{
  font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--txt-faint);margin:18px 0 8px 2px;
}
.grp:first-child{margin-top:2px}

/* proiect */
.pcard{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--surface);border:0;border-radius:var(--r);box-shadow:var(--amb);
  padding:14px;margin-bottom:9px;cursor:pointer;
}
.pcard:hover{background:var(--surface-2)}
.pcard .pname{font-size:15.5px;font-weight:500}
.pcard .pmeta{font-size:12.5px;color:var(--txt-dim);margin-top:2px}
.pcard .ppre{font-family:var(--mono);font-size:10px;letter-spacing:.09em;color:var(--txt-faint)}

/* bara de filtre a listei */
.filterbar{
  display:flex;align-items:center;gap:7px;padding:10px 15px;background:var(--surface);
  box-shadow:var(--amb);overflow-x:auto;flex:0 0 auto;scrollbar-width:none;
}
.filterbar::-webkit-scrollbar{display:none}
.fchip{
  display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;cursor:pointer;
  background:var(--surface-3);border:0;border-radius:var(--r-m);padding:6px 10px;
  color:var(--txt-dim);font-size:13px;
}
/* Activ = text plin + linie de 2px. NICIO casetă umplută, niciun gradient. */
.fchip.on{color:var(--txt);box-shadow:inset 0 -2px 0 var(--accent)}
.fchip .n{font-family:var(--mono);font-size:10px;color:var(--txt-faint)}
.fchip.on .n{color:var(--accent)}

/* rând de tichet */
.row{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:var(--surface);border:0;border-radius:var(--r-m);box-shadow:var(--amb);
  padding:11px 12px;margin-bottom:8px;
}
.row:hover{background:var(--surface-2)}
.row .lay{width:3px;align-self:stretch;border-radius:2px;flex:0 0 auto}
.row .rid{font-family:var(--mono);font-size:10px;color:var(--txt-faint);flex:0 0 auto}
.row .rt{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.done .rt{color:var(--txt-faint);text-decoration:line-through}
.row .cc{display:inline-flex;align-items:center;gap:3px;color:var(--txt-faint);font-family:var(--mono);font-size:10px;flex:0 0 auto}
.dotnew{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 auto}

/* rând „Pe mine" */
.mrow{
  display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
  background:var(--surface);border:0;border-radius:var(--r-m);box-shadow:var(--amb);
  padding:12px;margin-bottom:8px;
}
.mrow:hover{background:var(--surface-2)}
.mrow .col{flex:1;min-width:0}
.mrow .mt{font-size:14.5px;line-height:1.35;margin-bottom:5px}
.mrow .meta{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--txt-dim);flex-wrap:wrap}
.mrow .meta .proj{font-family:var(--mono);font-size:10px;color:var(--txt-faint)}
.mrow .meta time{font-family:var(--mono);font-size:10px;color:var(--txt-faint);margin-left:auto}

/* ══ TICHET ════════════════════════════════════════════════════════════════ */
.tcard{background:var(--surface);border-radius:var(--r);box-shadow:var(--amb);padding:15px;margin-bottom:16px}
.tid{font-family:var(--mono);font-size:11px;letter-spacing:.06em}
.tcard h3{font-size:18px;font-weight:600;letter-spacing:-.015em;line-height:1.3;margin:6px 0 12px}
/* Proveniența: se scrie o dată, la creare, și nu se mai editează niciodată. */
.origin{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--txt-dim);flex-wrap:wrap}
.origin .dot{color:var(--txt-faint)}
.origin time{font-family:var(--mono);font-size:11px}
/* Pe cine stă ACUM. Gol = la creator; săgeata spune că a fost o predare. */
.holder{
  display:inline-flex;align-items:center;gap:7px;margin-top:12px;
  background:var(--surface-3);border-radius:var(--r-s);padding:5px 11px 5px 7px;font-size:13px;
}
.holder .arrow{color:var(--txt-faint);font-family:var(--mono);font-size:12px}
.holder .who{font-weight:500}
.holder.free{color:var(--txt-faint)}

.thread-label{
  font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--txt-faint);margin:0 0 11px 2px;display:flex;align-items:center;gap:8px;
}
.thread-label .n{color:var(--txt-dim)}

.cmt{display:flex;gap:10px;margin-bottom:15px}
.cmt .col{flex:1;min-width:0}
.cmt-head{display:flex;align-items:baseline;gap:7px;margin-bottom:5px}
.cmt-head .who{font-size:13.5px;font-weight:500}
.cmt-head time{font-family:var(--mono);font-size:10px;color:var(--txt-faint)}
.cmt-body{
  background:var(--surface);border-radius:var(--r-m);box-shadow:var(--amb);
  padding:11px 13px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;
}
.cmt.mine .cmt-body{background:var(--surface-2)}
.cmt-files{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.thumb{
  width:54px;height:54px;border-radius:var(--r-s);flex:0 0 auto;overflow:hidden;
  background:var(--surface-3);display:grid;place-items:center;color:var(--txt-faint);
  border:0;cursor:pointer;padding:0;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.filechip{
  display:inline-flex;align-items:center;gap:8px;height:54px;padding:0 13px 0 11px;
  background:var(--surface-3);border-radius:var(--r-s);color:var(--txt-dim);
  border:0;cursor:pointer;text-align:left;
}
.filechip .fname{font-size:12.5px;color:var(--txt);max-width:15ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.filechip .fsize{font-family:var(--mono);font-size:10px;color:var(--txt-faint)}

/* Nota de pasare NU e un comentariu: n-are casetă. E un eveniment în fir. */
.handoff{
  display:flex;align-items:center;gap:8px;margin:0 0 15px 2px;
  font-size:12.5px;color:var(--txt-dim);
}
.handoff .arrow{font-family:var(--mono);color:var(--accent)}
.handoff .who{color:var(--txt)}
.handoff time{font-family:var(--mono);font-size:10px;color:var(--txt-faint);margin-left:auto}

/* ── caseta de scris ──────────────────────────────────────────────────────── */
/* Câmpurile PĂSTREAZĂ chenarul — excepția din regula „fără linii": un câmp
   fără delimitare nu se mai citește ca un câmp. */
.composer{
  background:var(--surface);border-radius:var(--r);box-shadow:var(--amb);padding:11px;
  position:sticky;bottom:0;margin-top:6px;
}
.composer textarea{
  width:100%;background:var(--field-bg);border:1px solid var(--line);border-radius:var(--r-m);
  color:var(--txt);font-family:var(--display);font-size:14px;line-height:1.5;padding:10px 12px;
  resize:none;min-height:44px;max-height:140px;
}
.composer textarea::placeholder{color:var(--txt-faint)}
.composer textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.pending{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.pending .x{
  position:absolute;top:-5px;right:-5px;width:17px;height:17px;border-radius:50%;
  background:var(--surface-3);color:var(--txt-dim);border:0;cursor:pointer;
  display:grid;place-items:center;font-size:11px;line-height:1;
}
.pending .wrap{position:relative}
.composer-bar{display:flex;align-items:center;gap:7px;margin-top:9px}
.composer-bar .spacer{flex:1}
.to-btn{
  display:inline-flex;align-items:center;gap:6px;background:var(--surface-3);border:0;
  border-radius:var(--r-s);padding:6px 10px;color:var(--txt-dim);font-size:13px;cursor:pointer;
}
.to-btn.set{color:var(--txt);box-shadow:inset 0 -2px 0 var(--accent)}
.to-btn .lbl{color:var(--txt-faint);font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase}
.send{
  display:inline-flex;align-items:center;gap:8px;background:var(--accent);border:0;border-radius:var(--r-s);
  padding:8px 13px;color:var(--on-accent);font-size:13.5px;font-weight:500;cursor:pointer;
}
.send[disabled]{opacity:.42;cursor:default}
.send .key{font-family:var(--mono);font-size:11px;opacity:.7}

/* selectorul de destinatar */
.picker{background:var(--surface-2);border-radius:var(--r-m);box-shadow:var(--amb);margin-top:9px;overflow:hidden}
.picker .ph{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--txt-faint);padding:9px 13px 6px;
}
.prow{
  display:flex;align-items:center;gap:9px;padding:9px 13px;cursor:pointer;font-size:14px;
  width:100%;text-align:left;background:none;border:0;
}
.prow + .prow{border-top:1px solid var(--line-soft)}
.prow:hover{background:var(--surface-3)}
.prow.on{box-shadow:inset 2px 0 0 var(--accent)}
.prow .sub{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--txt-faint)}

/* ══ BARA DE JOS ═══════════════════════════════════════════════════════════ */
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--surface);flex:0 0 auto}
.tabbar button{
  flex:1;background:none;border:0;padding:8px 0 10px;color:var(--txt-faint);cursor:pointer;
  font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px;
}
.tabbar button.on{color:var(--txt);box-shadow:inset 0 2px 0 var(--accent)}
.tabwrap{position:relative;display:grid;place-items:center}
.badge{
  position:absolute;transform:translate(12px,-5px);
  font-family:var(--mono);font-size:9px;background:var(--accent);color:var(--on-accent);
  border-radius:8px;min-width:15px;height:15px;display:grid;place-items:center;padding:0 4px;
}

/* ══ LIGHTBOX + TOAST ══════════════════════════════════════════════════════ */
.lb{
  position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:60;
  display:grid;place-items:center;padding:24px;cursor:zoom-out;
}
.lb img{max-width:100%;max-height:100%;border-radius:var(--r-m)}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:70;
  background:var(--surface-2);color:var(--txt);border-radius:var(--r-m);box-shadow:var(--amb-lg);
  padding:11px 17px;font-size:13.5px;pointer-events:none;
  opacity:0;transition:opacity .16s ease;
}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- ═══ REGIA: cine ești și ce temă. Nu face parte din aplicație — există ca
     să poți juca AMBELE capete ale pasei fără două conturi. ═══════════════ -->
<div class="rig">
  <div class="grp">
    <span class="lbl">Ești</span>
    <div class="seg" id="whoami"></div>
  </div>
  <div class="grp">
    <span class="lbl">Temă</span>
    <div class="seg" id="themer">
      <button data-set="dark" class="on">Închis</button>
      <button data-set="light">Deschis</button>
    </div>
  </div>
  <span class="spacer"></span>
  <span class="hint">Pasează un tichet, apoi schimbă cine ești: vezi cum ajunge la celălalt.</span>
  <button class="reset" id="reset">Repornește</button>
</div>

<div id="app">
  <div id="head"></div>
  <main id="main"></main>
  <div id="tabs"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════════════════════════════════════════════
   STARE ÎN MEMORIE
   ════════════════════════════════════════════════════════════════════════════ */
const MIN = 60000, HOUR = 60 * MIN, DAY = 24 * HOUR;
const now = Date.now();

const USERS = [
  { id: 'u1', name: 'Ionuț',     initials: 'IS', email: 'ionut@…'  },
  { id: 'u2', name: 'Alex',      initials: 'AM', email: 'alex@…'   },
  { id: 'u3', name: 'Maria',     initials: 'MP', email: 'maria@…'  },
  // Nume liber, fără cont: atribuibil, dar n-are cutie poștală.
  { id: 'u4', name: 'Echipa API', initials: 'EA', email: null      },
];

const PROJECTS = [
  { id: 'tur', prefix: 'TUR', name: 'Turnir',    desc: 'Platforma de înscrieri' },
  { id: 'mkt', prefix: 'MKT', name: 'Marketing', desc: 'Campania de toamnă'     },
  { id: 'per', prefix: 'HZ',  name: 'Personal',  desc: 'Gândurile mele'         },
];

function seed() {
  return {
    me: 'u1',
    view: { kind: 'projects' },
    /* Filtrul de om, per proiect: null = toți, 'none' = nepasate, altfel id. */
    filter: {},
    tickets: [
      { id:'TUR-42', p:'tur', title:'Formularul de înscriere pierde diacriticele la salvare', by:'u2', at: now - 3*DAY,  as:'u1', layer:0, done:false },
      { id:'TUR-51', p:'tur', title:'Export CSV pentru arbitri',                              by:'u1', at: now - 6*DAY,  as:'u2', layer:0, done:false },
      { id:'TUR-58', p:'tur', title:'Mailul de confirmare, varianta RO',                      by:'u1', at: now - 5*DAY,  as:null, layer:2, done:false },
      { id:'TUR-63', p:'tur', title:'Pagina publică de clasament',                            by:'u3', at: now - 2*DAY,  as:'u4', layer:3, done:false },
      { id:'TUR-30', p:'tur', title:'Schema de prețuri pentru ediția a doua',                 by:'u2', at: now - 9*DAY,  as:'u1', layer:1, done:false },
      { id:'TUR-19', p:'tur', title:'Bucket de atașamente + politici',                        by:'u1', at: now - 12*DAY, as:null, layer:0, done:true  },
      { id:'MKT-09', p:'mkt', title:'Verifică contractul cu furnizorul de SMS',               by:'u3', at: now - 4*DAY,  as:'u1', layer:0, done:false },
      { id:'MKT-11', p:'mkt', title:'Textele pentru landing',                                 by:'u3', at: now - 4*DAY,  as:null, layer:1, done:false },
      { id:'HZ-101', p:'per', title:'De citit: articolul despre normalizare Unicode',         by:'u1', at: now - 1*DAY,  as:null, layer:0, done:false },
      { id:'HZ-102', p:'per', title:'Idee: un mod „săptămâna asta" peste liste',              by:'u1', at: now - 8*HOUR, as:null, layer:0, done:false },

    /* Firul: comentarii ȘI pase, în aceeași ordine cronologică. */
    thread: [
      { id:'c1', t:'TUR-42', kind:'comment', by:'u2', at: now - 3*DAY + 2*HOUR,

        files:[{ name:'safari-ios.png', size:412000, type:'image/png', url:null }, { name:'consola.txt', size:4096, type:'text/plain', url:null }] },

        body:'E de la normalizarea NFD din iOS. Poți să-mi confirmi că se vede și pe Chrome Android înainte să schimb salvarea?', files:[] },
      { id:'c3', t:'TUR-51', kind:'comment', by:'u1', at: now - 5*DAY,

      { id:'h2', t:'TUR-51', kind:'handoff', by:'u1', to:'u2', at: now - 5*DAY + 30000 },
      { id:'c4', t:'MKT-09', kind:'comment', by:'u3', at: now - 26*HOUR,
        body:'Contractul expiră pe 1 octombrie. Te rog verifică dacă prețul pe SMS s-a schimbat.', files:[] },
      { id:'h3', t:'MKT-09', kind:'handoff', by:'u3', to:'u1', at: now - 26*HOUR + 20000 },
      { id:'h4', t:'TUR-30', kind:'handoff', by:'u2', to:'u1', at: now - 5*DAY },
      { id:'h5', t:'TUR-63', kind:'handoff', by:'u3', to:'u4', at: now - 2*DAY },
    ],
    /* Ce a văzut fiecare, per tichet. De aici ies „necitite". */
    seen: { u1: { 'TUR-30': now - 4*DAY }, u2: {}, u3: {}, u4: {} },
  };
}

let S = seed();
/* Ce se scrie acum în casetă, per tichet — ca schimbarea de ecran să nu piardă. */
let draft = {};
let pickerOpen = false;

/* ════════════════════════════════════════════════════════════════════════════
   AJUTOARE
   ════════════════════════════════════════════════════════════════════════════ */
const $ = (id) => document.getElementById(id);
const user = (id) => USERS.find((u) => u.id === id) || null;
const proj = (id) => PROJECTS.find((p) => p.id === id);
const ticket = (id) => S.tickets.find((t) => t.id === id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

const ICONS = {
  back:'<path d="m15 18-6-6 6-6"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>',
  today:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/>',
  week:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M12 14v4M9 16h6"/>',
  people:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  comment:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  attach:'<path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
  handoff:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.5-4.5L9 18"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  chev:'<path d="m9 18 6-6-6-6"/>',
};
const ico = (name, size = 19) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;

/** Inițialele stau în mono — sunt un cod, nu un nume. */
const avatar = (id, cls = '') => {
  const u = user(id);
  if (!u) return `<span class="av ghosted ${cls}">—</span>`;
  return `<span class="av ${u.id === S.me ? 'me' : ''} ${cls}">${u.initials}</span>`;
};

function ago(ts) {
  const d = now - ts;
  if (d < 2 * MIN) return 'acum';
  if (d < HOUR) return `acum ${Math.round(d / MIN)} min`;
  if (d < DAY) return `acum ${Math.round(d / HOUR)} h`;
  if (d < 2 * DAY) return 'ieri';
  if (d < 7 * DAY) return `acum ${Math.round(d / DAY)} zile`;
  return new Date(ts).toLocaleDateString('ro-RO', { day: 'numeric', month: 'short' });
}
function humanSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return Math.round(b / 1024) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}

const threadOf = (id) => S.thread.filter((x) => x.t === id).sort((a, b) => a.at - b.at);
const commentCount = (id) => S.thread.filter((x) => x.t === id && x.kind === 'comment').length;
const lastAt = (id) => { const th = threadOf(id); return th.length ? th[th.length - 1].at : 0; };

/** Necitit = ceva s-a întâmplat în fir după ultima mea vizită, și nu eu l-am făcut. */
function isNew(id) {
  const th = threadOf(id);
  const seenAt = (S.seen[S.me] || {})[id] || 0;
  return th.some((x) => x.at > seenAt && x.by !== S.me);
}
/** Cutia de pase: ce stă pe mine. Gol = al creatorului, deci nu ajunge aici. */
const inbox = () => S.tickets
  .filter((t) => t.as === S.me && !t.done)
  .sort((a, b) => lastAt(b.id) - lastAt(a.id));

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ════════════════════════════════════════════════════════════════════════════
   RANDARE
   ════════════════════════════════════════════════════════════════════════════ */
function render() {
  renderRig();
  const v = S.view;
  if (v.kind === 'projects') { head('Toate proiectele tale', 'Horizontal'); mainProjects(); }
  else if (v.kind === 'list') { const p = proj(v.p); head(p.name, p.desc, true); mainList(p); }
  else if (v.kind === 'inbox') { head('Pe mine', 'Toate proiectele'); mainInbox(); }
  else if (v.kind === 'ticket') { mainTicket(ticket(v.id)); }
  renderTabs();
}

function renderRig() {
  $('whoami').innerHTML = USERS.filter((u) => u.email).map((u) =>
    `<button data-u="${u.id}" class="${u.id === S.me ? 'on' : ''}">${avatar(u.id)}${u.name}</button>`
  ).join('');
}

function head(title, crumb, back = false) {
  $('head').innerHTML = `
    <div class="hdr">
      ${back ? `<button class="ghost" data-act="home" aria-label="Înapoi">${ico('back')}</button>` : ''}
      <div class="mid">
        <div class="crumb">${esc(crumb)}</div>
        <h2>${esc(title)}</h2>
      </div>
      <button class="ghost" aria-label="Caută">${ico('search', 18)}</button>
    </div>`;
}

/* ── proiecte ─────────────────────────────────────────────────────────────── */
function mainProjects() {
  $('main').innerHTML = `<div class="pad">` + PROJECTS.map((p) => {
    const ts = S.tickets.filter((t) => t.p === p.id);
    const open = ts.filter((t) => !t.done).length;
    const mine = ts.filter((t) => t.as === S.me && !t.done).length;
    return `<button class="pcard" data-p="${p.id}">
      <div style="flex:1;min-width:0">
        <div class="ppre">${p.prefix}</div>
        <div class="pname">${esc(p.name)}</div>
        <div class="pmeta">${open} deschise${mine ? ` · <span style="color:var(--accent)">${mine} pe mine</span>` : ''}</div>
      </div>
      ${ico('chev', 17)}
    </button>`;
  }).join('') + `</div>`;
}

/* ── listă de proiect, cu filtrul de om ───────────────────────────────────── */
function mainList(p) {
  const all = S.tickets.filter((t) => t.p === p.id);
  const f = S.filter[p.id] ?? null;

  // Doar oamenii care chiar au ceva aici — un filtru cu zero e zgomot.
  const holders = USERS.filter((u) => all.some((t) => t.as === u.id));
  const nUnassigned = all.filter((t) => !t.as).length;

  const chips = [
    `<button class="fchip ${f === null ? 'on' : ''}" data-f="">Toți <span class="n">${all.length}</span></button>`,
    nUnassigned ? `<button class="fchip ${f === 'none' ? 'on' : ''}" data-f="none">Nepasate <span class="n">${nUnassigned}</span></button>` : '',
    ...holders.map((u) => {
      const n = all.filter((t) => t.as === u.id).length;
      return `<button class="fchip ${f === u.id ? 'on' : ''}" data-f="${u.id}">${avatar(u.id)}${esc(u.name)} <span class="n">${n}</span></button>`;
    }),
  ].join('');

  const shown = all.filter((t) => f === null ? true : f === 'none' ? !t.as : t.as === f);

  $('main').innerHTML = `
    <div class="filterbar">${chips}</div>
    <div class="pad">${
      shown.length === 0
        ? `<p class="empty"><span class="big">Nimic aici</span>Niciun tichet nu stă pe omul ales.</p>`
        : shown.map((t) => `
          <button class="row ${t.done ? 'done' : ''}" data-t="${t.id}">
            <span class="lay" style="background:var(--layer-${t.layer})"></span>
            <span class="rid">${t.id}</span>
            <span class="rt">${esc(t.title)}</span>
            ${isNew(t.id) ? '<span class="dotnew"></span>' : ''}
            ${commentCount(t.id) ? `<span class="cc">${ico('comment', 12)}${commentCount(t.id)}</span>` : ''}
            ${t.as ? avatar(t.as) : ''}
          </button>`).join('')
    }</div>`;
}

/* ── cutia de pase ────────────────────────────────────────────────────────── */
function mainInbox() {
  const items = inbox();
  if (!items.length) {
    $('main').innerHTML = `<p class="empty"><span class="big">Nimic pe tine</span>
      Aici ajunge doar ce ți-a pasat cineva.<br>Tichetele pe care ți le faci singur nu apar niciodată.</p>`;
    return;
  }
  const fresh = items.filter((t) => isNew(t.id));
  const rest  = items.filter((t) => !isNew(t.id));

  const row = (t) => {
    const h = threadOf(t.id).filter((x) => x.kind === 'handoff' && x.to === S.me).pop();
    const from = h ? user(h.by) : user(t.by);
    return `<button class="mrow" data-t="${t.id}">
      ${isNew(t.id) ? '<span class="dotnew" style="margin-top:7px"></span>' : '<span style="width:6px;flex:0 0 auto"></span>'}
      <div class="col">
        <div class="mt">${esc(t.title)}</div>
        <div class="meta">
          <span class="proj">${t.id}</span>
          ${avatar(from ? from.id : null)}
          <span>de la ${esc(from ? from.name : '—')}</span>
          <time>${ago(lastAt(t.id) || t.at)}</time>
        </div>
      </div>
    </button>`;
  };

  $('main').innerHTML = `<div class="pad">
    ${fresh.length ? `<p class="grp">Necitite</p>` + fresh.map(row).join('') : ''}
    ${rest.length ? `<p class="grp">Mai devreme</p>` + rest.map(row).join('') : ''}
  </div>`;
}

/* ── tichetul ─────────────────────────────────────────────────────────────── */
function mainTicket(t) {
  const p = proj(t.p);
  const creator = user(t.by);
  const holder = t.as ? user(t.as) : null;
  const d = draft[t.id] || { body: '', to: null, files: [] };

  $('head').innerHTML = `
    <div class="hdr">
      <button class="ghost" data-act="back" aria-label="Înapoi">${ico('back')}</button>
      <div class="mid"><div class="crumb">${esc(p.name)}</div><h2>Tichet</h2></div>
      <button class="ghost" aria-label="Marchează gata">${ico('check', 18)}</button>
    </div>`;

  const th = threadOf(t.id).map((x) => {
    if (x.kind === 'handoff') {
      const to = x.to ? user(x.to).name : 'nimeni';
      return `<div class="handoff">
        ${ico('handoff', 13)}
        <span class="who">${esc(user(x.by).name)}</span><span class="arrow">→</span><span class="who">${esc(to)}</span>
        <time>${ago(x.at)}</time>
      </div>`;
    }
    const au = user(x.by);
    return `<div class="cmt ${x.by === S.me ? 'mine' : ''}">
      ${avatar(x.by, 'lg')}
      <div class="col">
        <div class="cmt-head"><span class="who">${esc(au.name)}</span><time>${ago(x.at)}</time></div>
        <div class="cmt-body">${esc(x.body)}</div>
        ${x.files.length ? `<div class="cmt-files">${x.files.map(fileEl).join('')}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  const toU = d.to ? user(d.to) : null;

  $('main').innerHTML = `
    <div class="pad">
      <div class="tcard">
        <span class="tid" style="color:var(--layer-${t.layer})">${t.id}</span>
        <h3>${esc(t.title)}</h3>
        <div class="origin">
          ${avatar(t.by)}<span>creat de ${esc(creator.name)}</span>
          <span class="dot">·</span><time>${ago(t.at)}</time>
        </div>
        ${holder
          ? `<div class="holder"><span class="arrow">→</span>${avatar(holder.id)}<span class="who">${esc(holder.name)}</span></div>`
          : `<div class="holder free">nepasat — stă la ${esc(creator.name)}</div>`}
      </div>

      <p class="thread-label">Fir <span class="n">${commentCount(t.id)}</span></p>
      ${th || `<p class="empty" style="padding:22px 0 26px">Niciun comentariu încă.</p>`}

      <div class="composer">
        <textarea id="body" rows="2" placeholder="Scrie un comentariu…">${esc(d.body)}</textarea>
        ${d.files.length ? `<div class="pending">${d.files.map((f, i) =>
          `<span class="wrap">${fileEl(f)}<button class="x" data-rm="${i}" aria-label="Scoate">✕</button></span>`).join('')}</div>` : ''}
        <div class="composer-bar">
          <button class="ghost" data-act="attach" aria-label="Atașează un fișier">${ico('attach', 18)}</button>
          <button class="to-btn ${d.to ? 'set' : ''}" data-act="topick">
            ${d.to ? `<span class="lbl">către</span>${avatar(d.to)}${esc(toU.name)}` : `${ico('handoff', 15)}către…`}
          </button>
          <span class="spacer"></span>
          <button class="send" id="send" ${d.body.trim() || d.files.length || d.to ? '' : 'disabled'}>
            ${d.to ? 'Trimite și pasează' : 'Trimite'} <span class="key">↵</span>
          </button>
        </div>
        ${pickerOpen ? picker(t, d) : ''}
      </div>
    </div>
    <input type="file" id="filein" multiple hidden />`;

  const ta = $('body');
  ta.addEventListener('input', () => { (draft[t.id] ||= { body:'', to:null, files:[] }).body = ta.value; syncSend(t.id); });
  ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(t.id); } });
}

function picker(t, d) {
  return `<div class="picker">
    <p class="ph">Pasează lui</p>
    <button class="prow ${d.to === null ? 'on' : ''}" data-to="">
      <span class="av ghosted">—</span>Nimănui <span class="sub">rămâne la ${esc(user(t.by).name)}</span>
    </button>
    ${USERS.map((u) => `
      <button class="prow ${d.to === u.id ? 'on' : ''}" data-to="${u.id}">
        ${avatar(u.id)}${esc(u.name)}
        <span class="sub">${u.email ? esc(u.email) : 'fără cont'}</span>
      </button>`).join('')}
  </div>`;
}

function fileEl(f) {
  if (f.url) return `<button class="thumb" data-img="${f.url}"><img src="${f.url}" alt="${esc(f.name)}"></button>`;
  if ((f.type || '').startsWith('image/')) return `<span class="thumb">${ico('image', 20)}</span>`;
  return `<span class="filechip">${ico('file', 16)}<span><span class="fname">${esc(f.name)}</span><span class="fsize">${humanSize(f.size)}</span></span></span>`;
}

function syncSend(id) {
  const d = draft[id] || {};
  const btn = $('send');
  if (btn) btn.disabled = !(String(d.body || '').trim() || (d.files || []).length || d.to);
}

function renderTabs() {
  const n = inbox().filter((t) => isNew(t.id)).length;
  const k = S.view.kind;
  const tab = (key, icon, label, badge) => `
    <button data-tab="${key}" class="${k === key ? 'on' : ''}">
      <span class="tabwrap">${ico(icon)}${badge ? `<span class="badge">${badge}</span>` : ''}</span>${label}
    </button>`;
  $('tabs').innerHTML = `<div class="tabbar">
    ${tab('today', 'today', 'Azi', 0)}
    ${tab('week', 'week', '7 zile', 0)}
    ${tab('inbox', 'people', 'Pe mine', n)}
    ${tab('projects', 'grid', 'Proiecte', 0)}
  </div>`;
}

/* ════════════════════════════════════════════════════════════════════════════
   ACȚIUNI
   ════════════════════════════════════════════════════════════════════════════ */
function openTicket(id) {
  S.view = { kind: 'ticket', id, from: S.view.kind === 'ticket' ? S.view.from : { ...S.view } };
  pickerOpen = false;
  render();
  // Marcarea ca văzut se face DUPĂ randare, ca bulina să nu dispară sub deget
  // înainte să apuci să vezi de ce era acolo.
  setTimeout(() => { (S.seen[S.me] ||= {})[id] = Date.now(); renderTabs(); }, 900);
}

function send(id) {
  const t = ticket(id);
  const d = draft[id] || { body: '', to: null, files: [] };
  const body = d.body.trim();
  if (!body && !d.files.length && !d.to) return;
  const at = Date.now();

  if (body || d.files.length) {
    S.thread.push({ id: 'c' + at, t: id, kind: 'comment', by: S.me, at, body, files: d.files });
  }
  // Pasarea e un eveniment separat în fir, chiar dacă gestul a fost unul singur:
  // răspunde la altă întrebare decât comentariul („cine îl ține", nu „ce s-a zis").
  if (d.to !== null && d.to !== t.as) {
    S.thread.push({ id: 'h' + at, t: id, kind: 'handoff', by: S.me, to: d.to, at: at + 1 });
    t.as = d.to;
  }
  draft[id] = { body: '', to: null, files: [] };
  pickerOpen = false;
  (S.seen[S.me] ||= {})[id] = at + 2;
  render();
  toast(d.to ? `Pasat lui ${user(d.to).name}` : 'Comentariu trimis');
  const m = $('main'); if (m) m.scrollTop = m.scrollHeight;
}

/* ════════════════════════════════════════════════════════════════════════════
   EVENIMENTE
   ════════════════════════════════════════════════════════════════════════════ */
document.addEventListener('click', (e) => {
  const el = (sel) => e.target.closest(sel);
  let n;

  if ((n = el('[data-u]')))    { S.me = n.dataset.u; pickerOpen = false; render(); return; }
  if ((n = el('[data-set]')))  {
    document.documentElement.dataset.theme = n.dataset.set;
    document.querySelectorAll('#themer button').forEach((b) => b.classList.toggle('on', b === n));
    return;
  }
  if (el('#reset'))            { S = seed(); draft = {}; pickerOpen = false; render(); toast('Repornit'); return; }

  if ((n = el('[data-tab]')))  {
    const k = n.dataset.tab;
    if (k === 'today' || k === 'week') { toast('Ecranul ăsta există deja în aplicație'); return; }
    S.view = k === 'inbox' ? { kind: 'inbox' } : { kind: 'projects' };
    pickerOpen = false; render(); return;
  }
  if ((n = el('[data-p]')))    { S.view = { kind: 'list', p: n.dataset.p }; render(); return; }
  if ((n = el('[data-t]')))    { openTicket(n.dataset.t); return; }
  if (el('[data-act="home"]')) { S.view = { kind: 'projects' }; render(); return; }
  if (el('[data-act="back"]')) { S.view = S.view.from || { kind: 'projects' }; pickerOpen = false; render(); return; }

  if ((n = el('[data-f]')))    {
    const p = S.view.p;
    S.filter[p] = n.dataset.f === '' ? null : n.dataset.f;
    render(); return;
  }

  if (el('[data-act="topick"]')) { pickerOpen = !pickerOpen; render(); return; }
  if ((n = el('[data-to]')))     {
    const id = S.view.id;
    (draft[id] ||= { body:'', to:null, files:[] }).to = n.dataset.to || null;
    pickerOpen = false; render(); return;
  }
  if (el('[data-act="attach"]')) { $('filein').click(); return; }
  if ((n = el('[data-rm]')))     {
    const id = S.view.id;
    draft[id].files.splice(Number(n.dataset.rm), 1);
    render(); return;
  }
  if ((n = el('[data-img]')))    {
    const lb = document.createElement('div');
    lb.className = 'lb';
    lb.innerHTML = `<img src="${n.dataset.img}" alt="">`;
    lb.addEventListener('click', () => lb.remove());
    document.body.appendChild(lb);
    return;
  }
  if ((n = el('#send')))         { send(S.view.id); return; }
});

document.addEventListener('change', (e) => {
  if (e.target.id !== 'filein') return;
  const id = S.view.id;
  const d = (draft[id] ||= { body:'', to:null, files:[] });
  for (const f of e.target.files) {
    d.files.push({
      name: f.name, size: f.size, type: f.type,
      url: f.type.startsWith('image/') ? URL.createObjectURL(f) : null,
    });
  }
  render();
});

render();
</script>
</body>
</html>
